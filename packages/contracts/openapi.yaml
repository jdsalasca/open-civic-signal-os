openapi: 3.0.3
info:
  title: Open Civic Signal OS API
  version: 0.2.0
paths:
  /api/auth/profile/me:
    get:
      summary: Get full civic identity profile for authenticated user
      responses:
        '200':
          description: Full authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    put:
      summary: Update civic identity profile for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Updated full authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
  /api/auth/profile/{username}:
    get:
      summary: Get civic identity profile filtered by viewer audience
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audience-filtered civic identity profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/privacy/access-logs:
    get:
      summary: List the authenticated user's recent sensitive-data access events
      responses:
        '200':
          description: Recent sensitive-data access events for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensitiveDataAccessLogResponse'
  /api/help-center:
    get:
      summary: Get backend-owned onboarding steps and bilingual help guides for the authenticated user
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: en
        - name: surface
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HelpSurface'
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Onboarding state and help guides for the current audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpCenterResponse'
  /api/help-center/state:
    put:
      summary: Update backend-owned onboarding completion and dismissed-guide state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHelpCenterStateRequest'
      responses:
        '200':
          description: Persisted onboarding and guide-dismissal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpCenterStateResponse'
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: API up
          content:
            text/plain:
              schema:
                type: string
  /api/signals/prioritized:
    get:
      summary: Get prioritized civic backlog
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          required: false
          description: Optional comma-separated lifecycle status filter (for example `NEW` or `NEW,IN_PROGRESS`).
          schema:
            type: string
            example: NEW
        - in: query
          name: minScore
          required: false
          description: >-
            Only return signals scoring at or above this value. Applied in the database query, not
            to an already-fetched page, so totalElements reflects the filter. Combines with status
            so both conditions narrow together.
          schema:
            type: number
            minimum: 0
            example: 220
        - name: X-Community-Id
          in: header
          schema:
            type: string
            format: uuid
          required: false
      responses:
        '200':
          description: Paginated prioritized list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/top-10:
    get:
      summary: Get top 10 unresolved civic problems
      parameters:
        - name: X-Community-Id
          in: header
          schema:
            type: string
            format: uuid
          required: false
        - in: query
          name: minScore
          required: false
          description: >-
            Same threshold contract as the paginated ranking, so both endpoints agree on what
            "critical" means.
          schema:
            type: number
            minimum: 0
            example: 220
      responses:
        '200':
          description: List of top signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrioritizedSignal'
  /api/signals/bias-diagnostics:
    get:
      summary: Disparity diagnostics over how the platform treats comparable reports
      description: >-
        Reports, per category, whether a category is treated materially differently from the
        best-treated category in the same community: slower resolution, a lower resolution rate,
        or less attention. It does NOT measure fairness across populations, and no fairness
        weighting is applied to any score. The platform holds no equity or demographic data, and a
        weighting built on absent data would move real priorities invisibly. Every response
        repeats that scope statement rather than leaving it implied.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Per-category measurements, flags, and the comparison standard used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiasDiagnosticReport'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Community not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/bias-diagnostics/formula:
    get:
      summary: Bias diagnostic thresholds and version
      description: Published so a reviewer can see what counts as disparate instead of trusting the flag.
      responses:
        '200':
          description: Version and thresholds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiasDiagnosticThresholds'
  /api/signals/merge-review/suggestions:
    get:
      summary: Duplicate clustering suggestions awaiting a human decision
      description: >-
        Groups reports the similarity algorithm believes describe the same problem. Nothing here
        has been merged. Every candidate carries the score that justified proposing it, and a
        target whose suggestion was already declined still appears, marked with that decision,
        rather than vanishing and making the queue look permanently unfinished.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: threshold
          required: false
          description: Minimum similarity to propose. Defaults to 0.75. Must be greater than 0 and at most 1.
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.75
      responses:
        '200':
          description: Suggestions, strongest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignalMergeSuggestion'
        '400':
          description: Threshold is out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the moderation queue scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/signals/merge-review/decisions:
    post:
      summary: Record a human decision about a proposed merge
      description: >-
        The algorithm never merges on its own. An APPROVED decision applies the merge it
        authorises and records both in one transaction; REJECTED and SPLIT record the decision
        without touching the signals. The suggestions sent here are stored verbatim rather than
        recomputed, so a later change to the algorithm cannot rewrite what the reviewer was shown.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalMergeReviewRequest'
      responses:
        '200':
          description: Recorded decision, with a merged signal id only when a merge was applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalMergeReview'
        '400':
          description: >-
            Approval named no suggestions, or accepted one scoring below the stated threshold.
            Both would produce an unauditable merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the moderation queue scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Target signal or community not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/merge-review/history:
    get:
      summary: Every recorded merge decision, newest first
      description: >-
        Approvals and rejections alike. A log that only records approvals trains people to read
        it as a changelog rather than a record, and then they stop reading it.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignalMergeReview'
        '403':
          description: Caller does not hold the moderation queue scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/signals/{id}:
    get:
      summary: Get one civic signal detail by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '400':
          description: Invalid signal ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/meta:
    get:
      summary: Get aggregate metadata for current signal scope
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregated signal metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalMeta'
  /api/signals/formula:
    get:
      summary: Get the published prioritization formula, its version, and per-factor weights
      responses:
        '200':
          description: Published prioritization formula metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrioritizationFormula'
  /api/policy-simulation:
    post:
      summary: Compare several scoring weight sets against the real backlog
      description: >-
        A sandbox, not a diff. The single-change preview says how many positions move; this says
        which categories gain and which lose, because that is the policy consequence a decision
        should be argued about. A change that moves forty percent of the backlog is not necessarily
        a problem; a change that moves forty percent in one direction for one category is a policy
        choice, and it should be visible as one before anyone votes on it.
        It does NOT rank the scenarios: there is no best weight set, because best depends on what a
        community wants to prioritise, which is a value judgement the platform has no standing to
        make. Nothing is stored; a simulation is a question, not a decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarios]
              properties:
                scenarios:
                  type: array
                  minItems: 1
                  maxItems: 5
                  description: >-
                    At most five. More than that is a spreadsheet, not a decision aid, and the
                    limit is rejected rather than truncated so nobody compares a partial set.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: >-
                          Required. An unnamed scenario cannot be referred to in the discussion it
                          is meant to inform.
                      urgencyMultiplier:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                      impactMultiplier:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                      affectedPeopleDivisor:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                      affectedPeopleCap:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                      communityVotesDivisor:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                      communityVotesCap:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                limit:
                  type: integer
                  minimum: 1
                  maximum: 2000
      responses:
        '200':
          description: Per-scenario category shifts and readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySimulationReport'
        '400':
          description: >-
            No scenarios, more than five, an unnamed scenario, or a weight that is zero or
            negative. All rejected rather than adjusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/formula-change-proposals/preview:
    post:
      summary: What a set of scoring weights would do to the current backlog
      description: >-
        A pure computation over the backlog that exists now. Nothing is stored and nothing is
        applied, so any set of weights can be considered safely. This is the evidence a scoring
        change is judged against: how many signals move, and the largest movers. It does NOT
        predict the future, because changing the formula changes what people report and vote on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - urgencyMultiplier
                - impactMultiplier
                - affectedPeopleDivisor
                - affectedPeopleCap
                - communityVotesDivisor
                - communityVotesCap
              properties:
                urgencyMultiplier:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                impactMultiplier:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                affectedPeopleDivisor:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                affectedPeopleCap:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                communityVotesDivisor:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                communityVotesCap:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                limit:
                  type: integer
                  minimum: 1
                  maximum: 2000
      responses:
        '200':
          description: The reordering this set of weights would produce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaImpactPreview'
        '400':
          description: A weight is zero or negative, which would make every signal tie or score negatively
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/formula-change-proposals:
    post:
      summary: Record a proposal to change the scoring weights
      description: >-
        Stores the proposal with the impact preview computed at proposal time, so a decision is
        judged against the evidence the decider was shown. Platform-wide scope, so restricted to
        the platform owner. Recording an approval does not change the scoring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, rationale]
              properties:
                title:
                  type: string
                rationale:
                  type: string
                  description: >-
                    Required. A scoring change nobody explained cannot be judged after the fact.
                urgencyMultiplier:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                impactMultiplier:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                affectedPeopleDivisor:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                affectedPeopleCap:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                communityVotesDivisor:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                communityVotesCap:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
      responses:
        '200':
          description: The recorded proposal with its preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaChangeProposal'
        '400':
          description: Title or rationale missing, or a weight out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Scoring is platform-wide, so proposing requires the platform owner role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: List formula change proposals, newest first
      parameters:
        - in: query
          name: onlyUndecided
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormulaChangeProposal'
  /api/formula-change-proposals/{proposalId}:
    get:
      summary: One proposal with the preview it was decided on
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaChangeProposal'
        '404':
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/formula-change-proposals/{proposalId}/decision:
    post:
      summary: Approve or reject a proposal
      description: >-
        Records the decision. A proposal can only be decided once, because reopening a decided one
        would erase the record of the decision.
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The decided proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormulaChangeProposal'
        '409':
          description: Already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/surges:
    get:
      summary: Surge and trend detection per community category
      description: >-
        Compares the current window against a baseline median of the preceding windows and
        reports a surge only when the ratio is at or above threshold AND the absolute volume is
        meaningful. Every result carries the individual baseline windows and a plain-language
        reason, because a surge badge a human cannot check is the black box this project exists
        to avoid.
      parameters:
        - in: query
          name: allowGlobal
          description: Allow analytics across all communities when the caller has no membership.
          schema:
            type: boolean
            default: false
        - in: query
          name: windowDays
          description: Length of the current and baseline windows, in days.
          schema:
            type: integer
            default: 7
        - in: query
          name: baselineWindows
          description: How many preceding windows form the baseline.
          schema:
            type: integer
            default: 4
        - in: query
          name: minCurrentCount
          description: >-
            Absolute floor below which no percentage change is reported. Without it a quiet zone
            going from one report to three is a 300% surge, and a dashboard full of those teaches
            people to ignore the marker.
          schema:
            type: integer
            default: 5
        - in: query
          name: surgeMultiplier
          description: Ratio at or above which a zone is flagged.
          schema:
            type: number
            default: 2.0
        - in: query
          name: windowEnd
          description: >-
            Exclusive end of the current window, ISO date. Defaults to today. Supplying it makes
            the whole report reproducible.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Surge report with per-zone arithmetic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeReport'
        '400':
          description: A threshold is out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/surges/formula:
    get:
      summary: Surge detection formula and default thresholds
      description: >-
        The versioned formula on its own, so a dashboard can show how a verdict was reached
        without fetching every zone.
      parameters:
        - in: query
          name: allowGlobal
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Formula version, default thresholds, and baseline window layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeReport'
  /api/signals/aging:
    get:
      summary: Get backend-owned case aging buckets, SLA risk, and the created/resolved trend
      parameters:
        - in: query
          name: communityId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: slaTargetDays
          required: false
          schema:
            type: integer
            minimum: 1
            default: 30
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case aging and SLA risk payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalAging'
        '401':
          description: User is not a member of the requested community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/map:
    get:
      summary: Get one community map with mapped issue points, clusters, and coverage counters
      parameters:
        - name: communityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Optional comma-separated lifecycle status filter.
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Community issue map payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitySignalMap'
  /api/signals/map/heat:
    get:
      summary: Get heat summary across visible communities
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Optional comma-separated lifecycle status filter.
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cross-community heat map payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitySignalsHeatMap'
  /api/signals/mine:
    get:
      summary: Get signals created by the authenticated user
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated self-reported signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/{id}/vote:
    post:
      summary: Cast support vote for a signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated signal after vote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals:
    post:
      summary: Create a civic signal
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalCreateRequest'
      responses:
        '200':
          description: Created signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/{id}/status:
    patch:
      summary: Update signal lifecycle status
      parameters:
        - in: path
          name: id
