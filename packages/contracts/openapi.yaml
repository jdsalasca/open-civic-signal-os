        '409':
          description: Delivery was not failed, or automatic retry is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    IngestSource:
      type: string
      enum: [CSV_EXPORT, WHATSAPP_EXPORT, TELEGRAM_EXPORT]
      description: >-
        Where the file came from. Each source has its own reader and its own set of
        recognised columns; anything unrecognised fails loudly rather than guessing.
    IngestRequest:
      type: object
      required: [communityId, source, fileName, content]
      properties:
        communityId:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/IngestSource'
        fileName:
          type: string
          description: Original name, preserved in sourceRef as file#line for audit.
        content:
          type: string
          description: Raw file contents. Callers must not anonymise before ingest; redaction runs on publish.
        commit:
          type: boolean
          default: false
          description: >-
            Ignored on both routes. /validate never persists; /commit always does.
            Kept so a single client payload can drive both calls.
    IngestFieldError:
      type: object
      properties:
        rowIndex:
          type: integer
          description: 1-based row in the file, where row 1 is the header.
        field:
          type: string
          description: Column name, or "*" when the problem is the row shape itself.
        code:
          type: string
          enum: [REQUIRED, TOO_SHORT, TOO_LONG, NOT_A_NUMBER, OUT_OF_RANGE, UNKNOWN_CATEGORY, COLUMN_COUNT_MISMATCH]
        message:
          type: string
          description: Plain-language explanation the steward can act on.
        preview:
          type: string
          description: Truncated value preview, never the full row.
    IngestRowOutcome:
      type: object
      properties:
        rowIndex:
          type: integer
        valid:
          type: boolean
        sourceRef:
          type: string
          description: Present only when the row can be cited, as file#line.
        signalId:
          type: string
          format: uuid
          description: Present only after a successful commit.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/IngestFieldError'
    IngestReport:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/IngestSource'
        committed:
          type: boolean
        totalRows:
          type: integer
        acceptedRows:
          type: integer
        rejectedRows:
          type: integer
        detectedColumns:
          type: array
          items:
            type: string
        contentSha256:
          type: string
          description: >-
            Hash of the exact bytes submitted, so the same file can be shown to have
            produced the same report.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/IngestRowOutcome'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/IngestFieldError'
        errorsTruncated:
          type: boolean
          description: >-
            True when the flat error list hit its display cap. Every row still keeps its
            own full error list in outcomes, so nothing is lost.
        formula:
          $ref: '#/components/schemas/PrioritizationFormula'
        formulaVersion:
          type: string
          description: Version of the scoring formula the report was scored with.
        scoredAt:
          type: string
          format: date-time
        error:
          type: string
          description: Set instead of row results when the file itself could not be parsed.
    PublicDataAnonymizationFieldCheck:
      type: object
      description: One free-text field in a public dataset and whether it currently carries PII.
      properties:
        exportType:
          type: string
          description: Which dataset the field belongs to, so findings are attributable.
        field:
          type: string
        clean:
          type: boolean
          description: True when no record in this field carries a detectable pattern.
        recordsScanned:
          type: integer
        recordsWithFindings:
          type: integer
        categories:
          type: array
          description: Which patterns were detected, e.g. EMAIL, PHONE, NATIONAL_ID, PAYMENT_CARD.
          items:
            type: string
        exampleFindings:
          type: array
          description: >-
            Up to three truncated examples, so a steward knows what to look at without the
            checklist itself becoming the leak it is warning about.
          items:
            type: string
    PublicDataAnonymizationChecklist:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
          description: Freshness marker, per the dashboard-freshness rule.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PublicDataAnonymizationFieldCheck'
        blockingFindings:
          type: array
          description: One human-readable line per field that is not clean.
          items:
            type: string
        publishable:
          type: boolean
          description: >-
            True when no field carries a detectable pattern. Minting an open-data token is
            refused while this is false, unless the request sets acknowledgeResidualRisk.
        categories:
          type: array
          description: The full set of patterns the redactor can detect.
          items:
            type: string
    TransparencyMetric:
      type: object
      description: >-
        One measured figure with its previous-period value attached. A number in a transparency
        report only means something next to the number before it, so the delta travels with the
        figure rather than being computed by whatever renders it.
      properties:
        key:
          type: string
          example: MEDIAN_RESOLUTION_DAYS
        label:
          type: string
        value:
          type: integer
        unit:
          type: string
          enum: [count, days]
        previousValue:
          type: integer
          description: Null only when no prior period exists to compare against.
        delta:
          type: integer
        direction:
          type: string
          enum: [UP, DOWN, FLAT, BASELINE]
    TransparencySignalOutcome:
      type: object
      description: A single signal named in the report, either actioned or still unaddressed.
      properties:
        signalId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        category:
          type: string
        priorityScore:
          type: number
        locationLabel:
          type: string
        daysOpen:
          type: integer
          description: >-
            Measured to the end of the reported period for an unresolved signal, not to today.
            Measuring to today would change the figure on every regeneration, which is the
            non-determinism this report exists to avoid.
        reportedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    TransparencyReport:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        period:
          type: object
          properties:
            key:
              type: string
              example: 2026-03
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
              description: Exclusive upper bound.
            previous:
              type: object
              nullable: true
              description: The comparison month, null only for the first report.
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/TransparencyMetric'
        actioned:
          type: array
          description: Resolved during the period, fastest first.
          items:
            $ref: '#/components/schemas/TransparencySignalOutcome'
        unaddressed:
          type: array
          description: >-
            Reported in the period and still open at period end, highest priority first. Named
            deliberately: a report that lists only wins is marketing, and this list is what a
            resident uses to judge whether the institution is keeping up.
          items:
            $ref: '#/components/schemas/TransparencySignalOutcome'
        narrative:
          type: array
          items:
            type: string
        formulaVersion:
          type: string
          description: Scoring formula the figures were produced under, for reproducibility.
        generatedAt:
          type: string
          format: date-time
          description: >-
            When the report was generated. The only field that varies between two runs over the
            same period.
        complete:
          type: boolean
    MunicipalTicketField:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          description: Column type as a city importer would declare it, e.g. decimal(5,2).
        description:
          type: string
    MunicipalTicketRecord:
      type: object
      description: >-
        One ticket. No author id, account, or contact details: a ticket export leaves the
        platform, so the redacted view is the only one that leaves.
      properties:
        ticketRef:
          type: string
          description: >-
            Stable citation derived from the signal id. Deterministic, so regenerating an export
            does not invent new references and cost the city their ticket history.
          example: OCS-9F2A1C4B7D3E5A60
        externalCategoryCode:
          type: string
          description: City service code, or an UNMAPPED. prefix when the category is not mapped.
        title:
          type: string
        description:
          type: string
        location:
          type: string
          description: >-
            Free-text location label. Never coordinates: the precise location of a private home
            is a safety risk, not a routing convenience.
        status:
          type: string
        priorityScore:
          type: number
          description: >-
            Platform prioritisation score, provided as context. Explicitly NOT the city's own
            priority field.
        reportedAt:
          type: string
          format: date-time
        sourceChannel:
          type: string
          nullable: true
          description: How the report entered the platform, for provenance.
        sourceRef:
          type: string
          nullable: true
          description: File and line for an imported report, for provenance.
        platformUrl:
          type: string
          description: Link back to the public signal page.
    MunicipalTicketUnmappedCategory:
      type: object
      properties:
        category:
          type: string
        platformLabel:
          type: string
        affectedReports:
          type: integer
          description: How many reports this exclusion is currently costing.
        guidance:
          type: string
    MunicipalTicketExportRequest:
      type: object
      required: [communityId]
      properties:
        communityId:
          type: string
          format: uuid
        categoryMap:
          type: object
          description: >-
            Translation from platform categories to city service codes, supplied per request
            rather than stored. The codes belong to one city's helpdesk, and a stored mapping
            would keep applying after the city renames a service.
          additionalProperties:
            type: string
          example:
            infrastructure: SRV-ROADS-01
            utilities: SRV-WATER-04
        includeUnmapped:
          type: boolean
          default: false
          description: >-
            Export unmapped categories under an UNMAPPED. prefix instead of excluding them. The
            exclusions are still reported either way.
    MunicipalTicketExport:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        fieldMap:
          type: array
          description: Ships with every export so the columns are self-describing.
          items:
            $ref: '#/components/schemas/MunicipalTicketField'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/MunicipalTicketRecord'
        unmappedCategories:
          type: array
          items:
            $ref: '#/components/schemas/MunicipalTicketUnmappedCategory'
        exportedCount:
          type: integer
        excludedCount:
          type: integer
        categoryMap:
          type: object
          additionalProperties:
            type: string
    SurgeWindow:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: Exclusive.
        count:
          type: integer
          format: int64
    SurgeZone:
      type: object
      description: >-
        One zone's assessment with every input the verdict came from. The unit is community plus
        category: the platform has no validated neighbourhood geography, since locationLabel is
        free text written by residents and does not group reliably.
      properties:
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        category:
          type: string
        currentCount:
          type: integer
          format: int64
        baselineMedian:
          type: integer
          format: int64
          description: >-
            Median, not mean, of the baseline windows. A median does not move for one outlier
            window, which is exactly the spike being looked for.
        ratio:
          type: number
          description: currentCount divided by baselineMedian. Rendered as no-baseline when zero.
        verdict:
          type: string
          enum: [SURGE, STABLE, SUPPRESSED_LOW_VOLUME]
        reason:
          type: string
          description: The comparison and the threshold crossed, in plain language.
        baselineCounts:
          type: array
          description: >-
            The individual windows, so a human can check the median rather than trusting it.
          items:
            $ref: '#/components/schemas/SurgeWindow'
    SurgeReport:
      type: object
      properties:
        version:
          type: string
          example: v1
        thresholds:
          type: object
          properties:
            baselineWindows:
              type: integer
            minCurrentCount:
              type: integer
            surgeMultiplier:
              type: number
        windowEnd:
          type: string
          format: date
        windowDays:
          type: integer
        baselinePeriods:
          type: array
          description: Baseline window layout. Counts are zero here; the per-zone figures carry them.
          items:
            $ref: '#/components/schemas/SurgeWindow'
        surges:
          type: array
          description: Zones flagged as surging, highest ratio first.
          items:
            $ref: '#/components/schemas/SurgeZone'
        zonesEvaluated:
          type: array
          items:
            $ref: '#/components/schemas/SurgeZone'
        zonesConsidered:
          type: integer
        zonesSuppressedByMinVolume:
          type: integer
          description: >-
            How many zones were excluded by the absolute floor. Surfaced rather than hidden,
            since a suppressed zone is still a zone someone might be waiting on.
        generatedAt:
          type: string
          format: date-time
    SourceFreshness:
      type: object
      description: One monitored surface and how quiet it has been relative to its own history.
      properties:
        key:
          type: string
          enum: [REPORTS, PROPOSALS, DECISIONS, STATUS_CHANGES]
        label:
          type: string
        lastEventOn:
          type: string
          format: date
          nullable: true
        daysSinceLast:
          type: integer
          format: int64
          nullable: true
        medianGapDays:
          type: integer
          format: int64
          nullable: true
          description: >-
            Median gap between consecutive events, not mean. One long gap caused by a holiday or
            a freeze would otherwise become the normal gap and mask every future alert.
        multipleOfMedianGap:
          type: number
          description: daysSinceLast divided by medianGapDays.
        verdict:
          type: string
          enum: [FRESH, STALE, DORMANT, NO_BASELINE, NO_HISTORY]
        cause:
          type: string
          enum: [ON_CADENCE, UNKNOWN]
          description: >-
            ON_CADENCE only when the surface is behaving normally. UNKNOWN whenever silence is
            visible and its reason cannot be established from the data.
        reason:
          type: string
          description: Plain-language explanation of the verdict and what it does not tell you.
        totalEvents:
          type: integer
    DataFreshnessReport:
      type: object
      properties:
        version:
          type: string
          example: v1
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        generatedOn:
          type: string
          format: date
        allHealthy:
          type: boolean
        staleCount:
          type: integer
          description: Sources at STALE or DORMANT.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceFreshness'
        guidance:
          type: string
          description: >-
            What to do next. Names the intake path and municipal integrations as the things to
            check before concluding a community stopped reporting.
    ExplainabilitySnapshotCreateRequest:
      type: object
      required: [communityId, label]
      properties:
        communityId:
          type: string
          format: uuid
        label:
          type: string
          description: >-
            Required and free text, because a snapshot cited in meeting minutes has to say which
            meeting it was for. An unlabelled snapshot is unfindable six months later.
          example: Assembly of 12 March, agenda item 4
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
          description: How many ranked signals to freeze. Out-of-range values are rejected, not clamped.
    ExplainabilitySnapshot:
      type: object
      properties:
        snapshotId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
          nullable: true
        label:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        formulaVersion:
          type: string
          description: Scoring formula in force when the snapshot was taken.
        entryCount:
          type: integer
        contentHash:
          type: string
          description: >-
            SHA-256 over the canonical payload. Lets a later reader prove the rows were not
            altered after the assembly saw them.
          example: 9f2a1c4b7d3e5a60...
        verified:
          type: boolean
          nullable: true
          description: Present on single-snapshot reads, where the hash is recomputed on the way out.
        verificationNote:
          type: string
          nullable: true
        payload:
          type: string
          description: >-
            Canonical JSON of the frozen ranked rows, object keys sorted at every level and entry
            order preserved. Returned verbatim so a reader can recompute the hash themselves.
    ExplainabilitySnapshotVerification:
      type: object
      properties:
        snapshotId:
          type: string
          format: uuid
        recordedHash:
          type: string
          description: The hash stored at creation.
        recomputedHash:
          type: string
          description: >-
            The hash computed now from the stored payload. A mismatch means the rows were
            modified after creation.
        valid:
          type: boolean
        explanation:
          type: string
          description: What the result means, including what it does NOT prove.
    SignalMergeCandidate:
      type: object
      description: One duplicate the algorithm proposes, with the score that justified proposing it.
      properties:
        signalId:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        status:
          type: string
        reportedAt:
          type: string
          format: date-time
          nullable: true
        similarity:
          type: number
          nullable: true
          description: >-
            0..1, on the same scale the merge decision uses, so the queue and the decision can
            never disagree about what counted as similar.
    SignalMergeSuggestion:
      type: object
      properties:
        targetSignalId:
          type: string
          format: uuid
        targetTitle:
          type: string
        targetCategory:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SignalMergeCandidate'
        threshold:
          type: number
          description: The threshold this list was produced with.
        latestDecision:
          type: string
          nullable: true
          enum: [APPROVED, REJECTED, SPLIT]
          description: >-
            Most recent human decision for this target, so a reviewer sees what was already
            answered instead of re-deciding it.
        reviewedAt:
          type: string
          format: date-time
          nullable: true
    SignalMergeReviewRequest:
      type: object
      required: [targetSignalId, decision, suggestedSimilarities]
      properties:
        targetSignalId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPROVED, REJECTED, SPLIT]
        suggestedSimilarities:
          type: array
          description: >-
            What the reviewer was shown, supplied by the client and stored verbatim. Recomputing
            server-side would store today's number and rewrite history if the algorithm changes.
            Required non-empty for an approval, because an empty approval is unauditable.
          items:
            $ref: '#/components/schemas/SignalMergeCandidate'
        threshold:
          type: number
          description: The threshold the reviewer says they were applying. An approval containing a candidate below it is refused.
        note:
          type: string
          nullable: true
          description: Why the reviewer decided as they did, for the audit trail.
    SignalMergeReview:
      type: object
      description: A recorded human decision about a merge suggestion.
      properties:
        decisionId:
          type: string
          format: uuid
        targetSignalId:
          type: string
          format: uuid
        targetTitle:
          type: string
          nullable: true
        decision:
          type: string
          enum: [APPROVED, REJECTED, SPLIT]
        suggestedCount:
          type: integer
        mergedTargetSignalId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Null for anything other than an approval, so a caller cannot mistake "we recorded
            your rejection" for "we merged them".
        mergedTitle:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
        note:
          type: string
          nullable: true

    BiasDiagnosticThresholds:
      type: object
      properties:
        minCategoryReports:
          type: integer
          description: Below this, a category is marked NO_BASELINE instead of compared.
        minCommunityReports:
          type: integer
        slowerResolutionMultiplier:
          type: number
          description: How much slower than the reference category before resolution time is flagged.
        lowerResolutionRateMargin:
          type: number
          description: How far below the reference resolved share before a category is flagged.
        lowerAttentionMultiplier:
          type: number
          description: How far below the reference attention rate before a category is flagged.
    BiasCategoryDiagnostic:
      type: object
      description: One category's measured treatment, with every number the verdict came from.
      properties:
        category:
          type: string
        reports:
          type: integer
        resolved:
          type: integer
        medianDaysToResolve:
          type: integer
          format: int64
        resolvedShare:
          type: number
        medianPriorityScore:
          type: number
        votesPerReport:
          type: number
        flags:
          type: array
          description: >-
            NO_BASELINE when there are too few reports to compare; empty when the category matches
            the standard; otherwise one or more of SLOWER_RESOLUTION, LOWER_RESOLUTION_RATE,
            LOWER_ATTENTION.
          items:
            type: string
            enum: [NO_BASELINE, SLOWER_RESOLUTION, LOWER_RESOLUTION_RATE, LOWER_ATTENTION]
    BiasDiagnosticReport:
      type: object
      properties:
        version:
          type: string
          example: v1
        communityId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        thresholds:
          $ref: '#/components/schemas/BiasDiagnosticThresholds'
        totalReportsConsidered:
          type: integer
        communityMedianDaysToResolve:
          type: integer
          format: int64
          description: Context only. Comparisons are drawn against referenceCategory, not this.
        communityResolvedShare:
          type: number
        communityVotesPerReport:
          type: number
        referenceCategory:
          type: string
          nullable: true
          description: >-
            The best-treated category with enough reports, which every comparison is drawn against.
            The average is the wrong yardstick: with half the categories at 2 days and half at 40,
            the community median lands at 21 and a slow category reads as 1.9x rather than the 20x
            it is.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BiasCategoryDiagnostic'
        disparateCategories:
          type: array
          items:
            type: string
        categoriesWithoutBaseline:
          type: integer
        scopeStatement:
          type: string
          description: >-
            What this report is and is not, repeated on every response. A report titled "bias
            diagnostics" that stayed quiet about lacking equity data would invite a reader to
            conclude it measured fairness across populations.

    DigestItem:
      type: object
      description: One ranked item, carrying the components the score is built from rather than a sentence about them.
      properties:
        signalId:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        status:
          type: string
        locationLabel:
          type: string
          nullable: true
        priorityScore:
          type: number
        daysOpen:
          type: integer
          description: Days open as of the start of the reported week.
        whyRanked:
          type: string
          description: >-
            The same four inputs the published formula uses (urgency, impact, people affected,
            votes), so a reader can check the claim rather than take it on faith.
    DigestWeek:
      type: object
      properties:
        key:
          type: string
          example: 2026-W13
        startDate:
          type: string
          format: date
          description: Monday.
        endDate:
          type: string
          format: date
          description: Exclusive upper bound; the following Monday.
        previousKey:
          type: string
          description: The week before, so a reader has the comparison without asking for it.
    WeeklyDigest:
      type: object
      properties:
        version:
          type: string
          example: v1
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        week:
          $ref: '#/components/schemas/DigestWeek'
        topUnresolved:
          type: array
          items:
            $ref: '#/components/schemas/DigestItem'
        resolvedThisWeek:
          type: integer
        rejectedThisWeek:
          type: integer
          description: Counted separately. A rejection is a legitimate outcome but it is not a civic win.
        reportedThisWeek:
          type: integer
        stillOpenTotal:
          type: integer
          description: Open backlog as of the end of the reported week.
        body:
          type: string
          description: The rendered digest, suitable for an email or channel message.
        contentHash:
          type: string
          description: SHA-256 of the body, so a recipient can verify what they received.
        published:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        generatedAt:
          type: string
          format: date-time
          description: The only field that varies between two runs over the same week.
        deliveredToChannels:
          type: integer
          description: >-
            How many configured channels accepted the digest. Zero is normal when a community has
            configured none, and is not a failure. A channel that fails is recorded as a failed
            delivery and can be retried without republishing the week.
    DigestPublication:
      type: object
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        weekKey:
          type: string
        contentHash:
          type: string
        itemCount:
          type: integer
        unresolvableItemCount:
          type: integer
        publishedBy:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        body:
          type: string

    BacklogPublicationRequest:
      type: object
      required: [communityId, label]
      properties:
        communityId:
          type: string
          format: uuid
        label:
          type: string
          description: >-
            Required. An unlabelled publication is unfindable when someone asks which version they
            were looking at.
          example: Assembly of 12 March
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
    BacklogPublication:
      type: object
      properties:
        version:
          type: string
          example: v1
        publicationId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
          description: The frozen explainability snapshot, so the ranking itself is recoverable.
        label:
          type: string
        orderingHash:
          type: string
          description: >-
            SHA-256 over the sorted id:score lines of the published set. Sorted because equal scores
            have no defined order, and a check that failed on tie ordering would be noise.
        formulaVersion:
          type: string
        itemCount:
          type: integer
        publishedBy:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        current:
          type: boolean
        matchesLiveRanking:
          type: boolean
          nullable: true
          description: Present on create and on the current read; null in history listings.
        mismatchExplanation:
          type: string
          nullable: true
    BacklogPublicationVerification:
      type: object
      properties:
        matches:
          type: boolean
        publishedHash:
          type: string
        liveHash:
          type: string
        explanation:
          type: string
          description: >-
            What a mismatch means. A new report or a vote legitimately changes a ranking, so the
            text says what changed and explicitly avoids accusing anyone of tampering.

    FormulaWeightSet:
      type: object
      description: A candidate set of weights. Distinct from the running formula, which is a constant a deploy changes.
      properties:
        urgencyMultiplier:
          type: number
          minimum: 0
          exclusiveMinimum: true
        impactMultiplier:
          type: number
          minimum: 0
          exclusiveMinimum: true
        affectedPeopleDivisor:
          type: number
          minimum: 0
          exclusiveMinimum: true
        affectedPeopleCap:
          type: number
          minimum: 0
          exclusiveMinimum: true
        communityVotesDivisor:
          type: number
          minimum: 0
          exclusiveMinimum: true
        communityVotesCap:
          type: number
          minimum: 0
          exclusiveMinimum: true
    FormulaMover:
      type: object
      properties:
        signalId:
          type: string
          format: uuid
        title:
          type: string
        currentPosition:
          type: integer
        proposedPosition:
          type: integer
        positionDelta:
          type: integer
    FormulaImpactPreview:
      type: object
      properties:
        version:
          type: string
          example: v1
        currentExpression:
          type: string
        proposedExpression:
          type: string
        sampleSize:
          type: integer
          description: How many signals were reordered. A preview over three signals proves nothing.
        positionsMoved:
          type: integer
        positionsUnchanged:
          type: integer
        movedShare:
          type: number
        biggestMovers:
          type: array
          items:
            $ref: '#/components/schemas/FormulaMover'
        interpretation:
          type: string
          description: >-
            What this is and is not, on every response. Says it does not predict the future, does
            not judge whether the change is right, that ties are ordered by id so a tie-driven move
            is arbitrary, and that approving does not apply the change.
        computedAt:
          type: string
          format: date-time
    FormulaChangeProposal:
      type: object
      properties:
        proposalId:
          type: string
          format: uuid
        title:
          type: string
        rationale:
          type: string
        currentWeights:
          $ref: '#/components/schemas/FormulaWeightSet'
        proposedWeights:
          $ref: '#/components/schemas/FormulaWeightSet'
        preview:
          $ref: '#/components/schemas/FormulaImpactPreview'
        status:
          type: string
          enum: [PROPOSED, APPROVED, REJECTED]
        proposedBy:
          type: string
          format: uuid
        proposedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          format: uuid
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        decisionNote:
          type: string
          nullable: true
        applicationNote:
          type: string
          description: Restates that recording an approval does not change the scoring.

    TrustPulseSubmission:
      type: object
      required: [communityId, trustScore, responsivenessScore, transparencyScore]
      properties:
        communityId:
          type: string
          format: uuid
        period:
          type: string
          nullable: true
          description: Closed month as YYYY-MM. Defaults to the previous completed month.
          example: 2026-03
        trustScore:
          type: integer
          minimum: 1
          maximum: 5
          description: Deliberately coarse. A finer scale invites false precision from a small sample.
        responsivenessScore:
          type: integer
          minimum: 1
          maximum: 5
        transparencyScore:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
          description: >-
            Optional free text, at most 1000 characters. Never published verbatim: it is a prompt
            for a person to read, not a dataset row.
    TrustPulseSubmissionResult:
      type: object
      properties:
        responseId:
          type: string
          format: uuid
        periodKey:
          type: string
        replacedPrevious:
          type: boolean
          description: True when this answer replaced an earlier one for the same month.
        message:
          type: string
    TrustPulseDimension:
      type: object
      properties:
        key:
          type: string
          enum: [trust, responsiveness, transparency]
        label:
          type: string
        average:
          type: number
          nullable: true
          description: Null below the minimum sample. Absent rather than caveated, so it cannot be quoted out of context.
        responses:
          type: integer
        note:
          type: string
          nullable: true
          description: Why no average is reported, when one is not.
    TrustPulseAggregate:
      type: object
      properties:
        version:
          type: string
          example: v1
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        periodKey:
          type: string
        responses:
          type: integer
        enoughForAverage:
          type: boolean
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/TrustPulseDimension'
        interpretation:
          type: string
          description: >-
            What this is and is not, on every response. Says it measures perception from a
            self-selected sample rather than what the platform did, that a low score may mean
            dissatisfaction or may mean content residents did not reply, and that comments are
            never published verbatim.
        generatedAt:
          type: string
          format: date-time

    PolicyCategoryShift:
      type: object
      description: How one category fares under a scenario, in aggregate.
      properties:
        category:
          type: string
        signals:
          type: integer
        gained:
          type: integer
          description: Signals in this category that moved up.
        lost:
          type: integer
          description: Signals in this category that moved down.
        netPositionChange:
          type: integer
          description: Positive means the category moved up overall, negative means down.
        averagePositionDelta:
          type: number
          description: >-
            Average places gained per signal. The number a decision should be argued about,
            because it says how much a category is affected rather than how many items moved.
    PolicyScenarioResult:
      type: object
      properties:
        name:
          type: string
        expression:
          type: string
        positionsMoved:
          type: integer
        movedShare:
          type: number
        categoryShifts:
          type: array
          description: Biggest absolute shift first, so the most affected category is read first.
          items:
            $ref: '#/components/schemas/PolicyCategoryShift'
        biggestMovers:
          type: array
          items:
            $ref: '#/components/schemas/FormulaMover'
        reading:
          type: string
          description: >-
            Names the category that gains most and the one that loses most. "38% of the backlog
            moves" is a diff; "utilities gains four places while infrastructure loses three" is a
            policy consequence.
    PolicySimulationReport:
      type: object
      properties:
        version:
          type: string
          example: v1
        sampleSize:
          type: integer
          description: >-
            One snapshot of the backlog, reused for every scenario. Re-reading per scenario would
            let a concurrent report change the sample between them, which nobody could see.
        currentExpression:
          type: string
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/PolicyScenarioResult'
        interpretation:
          type: string
          description: >-
            What this is and is not, on every response. Says it does not rank the scenarios, does
            not predict the future, and stores nothing.
        computedAt:
          type: string
          format: date-time

    InstitutionalHandoffRequest:
      type: object
      required: [communityId, signalId, ticketRef, externalCategoryCode]
      properties:
        communityId:
          type: string
          format: uuid
        signalId:
          type: string
          format: uuid
        ticketRef:
          type: string
          description: >-
            Required. Without it the handoff cannot be matched to anything the institution says
            back.
        externalCategoryCode:
          type: string
          description: >-
            Required. A handoff with no service code cannot be checked against what the city
            actually filed it as.
        externalTicketId:
          type: string
          nullable: true
          description: >-
            The institution's own reference, when the community learns it. Recorded rather than
            fetched, because the platform cannot read the city system.
        slaTargetDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: >-
            Captured at handoff. A later change to the community target must not retroactively
            turn a past on-time handoff into a late one.
        note:
          type: string
          nullable: true
    InstitutionalHandoff:
      type: object
      properties:
        handoffId:
          type: string
          format: uuid
        signalId:
          type: string
          format: uuid
        signalTitle:
          type: string
        ticketRef:
          type: string
        externalCategoryCode:
          type: string
        externalTicketId:
          type: string
          nullable: true
        slaTargetDays:
          type: integer
        daysSinceHandoff:
          type: integer
          format: int64
        daysOverTarget:
          type: integer
          format: int64
        slaState:
          type: string
          enum: [WITHIN_TARGET, DUE_SOON, OVERDUE, CLOSED_ON_TIME, CLOSED_LATE]
          description: >-
            Derived from the community's own clock. CLOSED_LATE is judged against the moment it
            closed, not against today.
        statusSource:
          type: string
          enum: [NO_INSTITUTIONAL_STATUS, DECLARED_BY_COMMUNITY, DERIVED_FROM_SIGNAL_LIFECYCLE]
          description: >-
            Where the status came from. Never an observation of the institution, because the
            platform has no integration with a city helpdesk.
        handedOffAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
    InstitutionalBatchHandoffRequest:
      type: object
      required: [communityId, signalIds, categoryMap]
      properties:
        communityId:
          type: string
          format: uuid
        signalIds:
          type: array
          minItems: 1
          maxItems: 200
          description: >-
            At most 200. A larger batch should be split so a failure is attributable to a smaller set,
            and the limit is rejected rather than truncated.
          items:
            type: string
            format: uuid
        categoryMap:
          type: object
          description: >-
            Required. Translation from platform categories to city service codes. A signal whose
            category is not mapped is skipped and named, never defaulted, because a handoff filed
            against the wrong service code reaches the wrong department.
          additionalProperties:
            type: string
          example:
            utilities: SRV-WATER-04
            roads: SRV-ROADS-01
        slaTargetDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        note:
          type: string
          nullable: true
    InstitutionalBatchHandoffOutcome:
      type: object
      properties:
        signalId:
          type: string
          format: uuid
        signalTitle:
          type: string
          nullable: true
        outcome:
          type: string
          enum: [RECORDED, SKIPPED]
        detail:
          type: string
          description: >-
            The ticket reference when recorded, or why it was skipped. A skip is not a failure: it
            means the signal was already handed off, belongs to another community, or has no service
            code mapped.
    InstitutionalBatchHandoffResult:
      type: object
      properties:
        version:
          type: string
          example: v1
        communityId:
          type: string
          format: uuid
        requested:
          type: integer
        recorded:
          type: integer
        skipped:
          type: integer
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionalBatchHandoffOutcome'
        interpretation:
          type: string
          description: >-
            Restates that the platform cannot read the institution's system, so these are records of
            what was sent rather than confirmations of receipt.
    InstitutionalBridgeSummary:
      type: object
      properties:
        version:
          type: string
          example: v1
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        openHandoffs:
          type: integer
        acknowledged:
          type: integer
        resolved:
          type: integer
        overdue:
          type: integer
        dueSoon:
          type: integer
        handoffs:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionalHandoff'
        interpretation:
          type: string
          description: >-
            What this is and is not, on every response. Says the platform does not read the
            institution's system, and that an overdue handoff means the community's own target
            has passed rather than that the city has failed.
        generatedAt:
          type: string
          format: date-time

    ParticipatoryBudgetRequest:
      type: object
      required: [communityId, name, totalBudgetMinor]
      properties:
        communityId:
          type: string
          format: uuid
        name:
          type: string
          description: Required. An unnamed envelope is unfindable when a community runs more than one exercise.
        totalBudgetMinor:
          type: integer
          format: int64
          minimum: 1
          description: >-
            The envelope in minor units (cents). A long, never a double: money in floating point is
            a rounding bug waiting for a council meeting to expose it.
        currency:
          type: string
          default: USD
          description: Three-letter ISO code. Rejected if it is not one.
    ParticipatoryBudgetAllocation:
      type: object
      properties:
        proposalId:
          type: string
          format: uuid
        title:
          type: string
        rawCostText:
          type: string
          description: >-
            The original estimatedCost, kept so a reader can see what the parser was given when it
            failed.
        amountMinor:
          type: integer
          format: int64
          nullable: true
          description: >-
            Null when the text could not be read as an amount. Null rather than a guess: a budget
            that silently invented a number would produce an allocation that looks decided and is not.
        amountFormatted:
          type: string
          nullable: true
        costReadable:
          type: boolean
        included:
          type: boolean
    ParticipatoryBudget:
      type: object
      properties:
        budgetId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        name:
          type: string
        totalBudgetMinor:
          type: integer
          format: int64
        totalFormatted:
          type: string
        currency:
          type: string
        allocations:
          type: integer
        unreadableCosts:
          type: integer
          description: >-
            How many proposals have a cost that could not be read. A selection that looks within
            budget while this is non-zero is not within budget, it is unknown.
        includedTotalMinor:
          type: integer
          format: int64
        includedTotalFormatted:
          type: string
        remainingMinor:
          type: integer
          format: int64
          description: Negative when the selection exceeds the envelope.
        remainingFormatted:
          type: string
        withinBudget:
          type: boolean
        allocationViews:
          type: array
          description: Unreadable costs first, then the largest, so what needs attention is read first.
          items:
            $ref: '#/components/schemas/ParticipatoryBudgetAllocation'
        interpretation:
          type: string
          description: >-
            What the arithmetic means and what it does not. Says it does not choose which proposals
            to fund, and that an unreadable cost makes whether the selection fits unknown rather
            than confirmed.
        createdAt:
          type: string
          format: date-time

    CreateAssemblyRequest:
      type: object
      required: [communityId, title, scheduledFor]
      properties:
        communityId:
          type: string
          format: uuid
        title:
          type: string
          description: Required. An untitled assembly is unfindable when a community holds more than one.
        scheduledFor:
          type: string
          format: date-time
          description: Required. An assembly with no date cannot be planned around.
        location:
          type: string
          nullable: true
    RecordAssemblyDecisionRequest:
      type: object
      required: [decision, rationale]
      properties:
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The proposal or signal the decision is about. Nullable because an assembly can decide
            something not yet in the system, and forcing a link would make people create placeholder
            records.
        subjectType:
          type: string
          nullable: true
        decision:
          type: string
          enum: [APPROVED, REJECTED, DEFERRED, NOTED]
        rationale:
          type: string
          description: Required. A decision nobody explained cannot be reviewed afterwards.
    AssemblyDecision:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          nullable: true
        subjectType:
          type: string
          nullable: true
        decision:
          type: string
          enum: [APPROVED, REJECTED, DEFERRED, NOTED]
        rationale:
          type: string
        recordedBy:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
    CommunityAssembly:
      type: object
      properties:
        version:
          type: string
          example: v1
        assemblyId:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        title:
          type: string
        scheduledFor:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        status:
          type: string
          enum: [SCHEDULED, OPEN, CLOSED, CANCELLED]
        snapshotId:
          type: string
          format: uuid
          nullable: true
        snapshotContentHash:
          type: string
          nullable: true
          description: What makes the ranking deliberated over checkable afterwards.
        evidenceCaptured:
          type: boolean
          description: >-
            False means the ranking cannot be reproduced, which is reported rather than hidden: a
            decision made over evidence nobody can produce is a decision nobody can review.
        convenedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        minutes:
          type: string
          nullable: true
          description: Free text. The platform does not treat it as the official record.
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/AssemblyDecision'
        interpretation:
          type: string
          description: >-
            What this record is and is not, on every read. Says it is not the official minutes and
            that the platform records decisions rather than making them, and warns when no evidence
            snapshot is attached.

    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
    CommunityPermissionDeniedError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [code, communityId, permissionScope, currentRole, allowedRoles]
          properties:
            code:
              type: string
              enum: [COMMUNITY_PERMISSION_DENIED]
            communityId:
              type: string
              format: uuid
            permissionScope:
              type: string
              enum:
                - CREATE_PROPOSAL

                - IMPORT_SIGNALS
                
                - MANAGE_MODERATION_QUEUE
                - MANAGE_PRIVACY_SETTINGS
                - MANAGE_DECISION_LEDGER
                - MANAGE_GOVERNANCE_LIBRARY
                - MANAGE_PROJECT_BOARDS
                - CREATE_THREAD
                - ADD_THREAD_MESSAGE
                - MODERATE_THREAD_MESSAGE
                - POST_ROOM_MESSAGE
                - MANAGE_ROOMS
                - JOIN_ACTIVITIES
                - MANAGE_ACTIVITIES
                - BOOK_RESOURCES
                - MANAGE_RESOURCES
                - MANAGE_INTEGRATIONS
                - CREATE_OFFICIAL_UPDATE
                - UPDATE_OFFICIAL_UPDATE
                - MANAGE_MEMBERSHIPS
                - MANAGE_PERMISSION_POLICIES
                - VIEW_SENSITIVE_DATA
            currentRole:
              type: string
              enum: [MEMBER, MODERATOR, COORDINATOR, PUBLIC_SERVANT_LIAISON]
            allowedRoles:
              type: array
              items:
                type: string
                enum: [MEMBER, MODERATOR, COORDINATOR, PUBLIC_SERVANT_LIAISON]
    Notification:
      type: object
      properties:
        id:
          type: string
        channel:
          type: string
          enum: [WHATSAPP, TELEGRAM, EMAIL]
        message:
          type: string
        sentAt:
          type: string
          format: date-time
        recipientGroup:
          type: string
    ScoreBreakdown:
      type: object
      required:
        - urgency
        - impact
        - affectedPeople
        - communityVotes
      properties:
        urgency:
          type: number
        impact:
          type: number
        affectedPeople:
          type: number
        communityVotes:
          type: number
    PrioritizedSignal:
      type: object
      required:
        - id
        - title
        - category
        - scoreBreakdown
        - priorityScore
        - status
        - explainabilitySummary
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        scoreBreakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        priorityScore:
          type: number
        status:
          type: string
          enum: [NEW, IN_PROGRESS, RESOLVED]
        explainabilitySummary:
          $ref: '#/components/schemas/ExplainabilitySummary'
    PagedPrioritizedSignals:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PrioritizedSignal'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
    SignalResponse:
      type: object
      required:
        - id
        - title
        - description
        - category
        - status
        - priorityScore
        - scoreBreakdown
        - explainabilitySummary
        - latitude
        - longitude
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        assignedToUsername:
          type: string
        locationLabel:
          type: string
        evidenceUrls:
          type: array
          items:
            type: string
        category:
          type: string
        status:
          type: string
        priorityScore:
          type: number
        scoreBreakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        communityVotes:
          type: integer
        reactions:
          type: object
          additionalProperties:
            type: integer
        viewerReaction:
          type: string
        explainabilitySummary:
          $ref: '#/components/schemas/ExplainabilitySummary'
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        sourceChannel:
          $ref: '#/components/schemas/SignalSourceChannel'
        sourceRef:
          type: string
          nullable: true
          description: Pointer back to the original record, e.g. a CSV row or a municipal ticket
        transformationVersion:
          type: string
          description: Scoring rule version that produced this priority score
    SignalSourceChannel:
      type: string
      description: Where the signal entered the system, so an audit can tell a citizen report from an institutional update
      enum: [WEB_FORM, CSV_IMPORT, CHAT_EXPORT, PUBLIC_API, INSTITUTIONAL_UPDATE]
    SignalSlaRisk:
      type: string
      enum: [ON_TRACK, AT_RISK, BREACHED]
    SignalAgingBucket:
      type: object
      required: [bucket, count]
      properties:
        bucket:
          type: string
          enum: [FRESH_0_7, AGING_7_14, STALE_14_PLUS, OVERDUE]
        count:
          type: integer
          format: int64
    SignalAgingItem:
      type: object
      required: [id, title, category, status, priorityScore, ageDays, slaTargetDays, slaRisk, daysOverTarget, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        status:
          type: string
        priorityScore:
          type: number
        ageDays:
          type: integer
          format: int64
        slaTargetDays:
          type: integer
          format: int64
        slaRisk:
          $ref: '#/components/schemas/SignalSlaRisk'
        daysOverTarget:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    SignalAgingTrendPoint:
      type: object
      required: [date, created, resolved]
      properties:
        date:
          type: string
          format: date
        created:
          type: integer
          format: int64
        resolved:
          type: integer
          format: int64
    SignalAging:
      type: object
      required: [generatedAt, slaTargetDays, unresolvedCount, atRiskCount, breachedCount, medianAgeDays, ageBuckets, atRiskSignals, trend]
      properties:
        communityId:
          type: string
          format: uuid
          nullable: true
        generatedAt:
          type: string
          format: date-time
          description: Freshness timestamp for the whole payload
        slaTargetDays:
          type: integer
          format: int64
        unresolvedCount:
          type: integer
          format: int64
        atRiskCount:
          type: integer
          format: int64
        breachedCount:
          type: integer
          format: int64
        medianAgeDays:
          type: integer
          format: int64
        ageBuckets:
          type: array
          items:
            $ref: '#/components/schemas/SignalAgingBucket'
        atRiskSignals:
          type: array
          description: Unresolved cases that are at risk or breached, worst first
          items:
            $ref: '#/components/schemas/SignalAgingItem'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/SignalAgingTrendPoint'
    FormulaWeight:
      type: object
      required: [factor, input, expression, cap]
      properties:
        factor:
          type: string
          enum: [urgency, impact, affectedPeople, communityVotes]
        input:
          type: string
          description: The raw signal field this factor reads
        expression:
          type: string
          description: The exact arithmetic the backend applies
        cap:
          type: number
          description: Upper bound on this factor's contribution
    PrioritizationFormula:
      type: object
      required: [version, formula, effectiveFrom, weights, cappedFactors, changeNote]
      properties:
        version:
          type: string
          description: Must match the transformationVersion stamped on signals
        formula:
          type: string
        effectiveFrom:
          type: string
          format: date
        weights:
          type: array
          items:
            $ref: '#/components/schemas/FormulaWeight'
        cappedFactors:
          type: array
          description: Factors whose contribution saturates at the published cap
          items:
            type: string
