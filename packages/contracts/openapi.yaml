components:
  schemas:
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
    CommunityPermissionDeniedError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [code, communityId, permissionScope, currentRole, allowedRoles]
          properties:
            code:
              type: string
              enum: [COMMUNITY_PERMISSION_DENIED]
            communityId:
              type: string
              format: uuid
            permissionScope:
              type: string
              enum:
                - CREATE_PROPOSAL
                - MANAGE_MODERATION_QUEUE
                - MANAGE_PRIVACY_SETTINGS
                - MANAGE_DECISION_LEDGER
                - MANAGE_GOVERNANCE_LIBRARY
                - MANAGE_PROJECT_BOARDS
                - CREATE_THREAD
                - ADD_THREAD_MESSAGE
                - MODERATE_THREAD_MESSAGE
                - CREATE_OFFICIAL_UPDATE
                - UPDATE_OFFICIAL_UPDATE
                - MANAGE_MEMBERSHIPS
                - MANAGE_PERMISSION_POLICIES
                - VIEW_SENSITIVE_DATA
            currentRole:
              type: string
              enum: [MEMBER, MODERATOR, COORDINATOR, PUBLIC_SERVANT_LIAISON]
            allowedRoles:
              type: array
              items:
                type: string
                enum: [MEMBER, MODERATOR, COORDINATOR, PUBLIC_SERVANT_LIAISON]
    Notification:
      type: object
      properties:
        id:
          type: string
        channel:
          type: string
          enum: [WHATSAPP, TELEGRAM, EMAIL]
        message:
          type: string
        sentAt:
          type: string
          format: date-time
        recipientGroup:
          type: string
    ScoreBreakdown:
      type: object
      required:
        - urgency
        - impact
        - affectedPeople
        - communityVotes
      properties:
        urgency:
          type: number
        impact:
          type: number
        affectedPeople:
          type: number
        communityVotes:
          type: number
    PrioritizedSignal:
      type: object
      required:
        - id
        - title
        - category
        - scoreBreakdown
        - priorityScore
        - status
        - explainabilitySummary
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        scoreBreakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        priorityScore:
          type: number
        status:
          type: string
          enum: [NEW, IN_PROGRESS, RESOLVED]
        explainabilitySummary:
          $ref: '#/components/schemas/ExplainabilitySummary'
    PagedPrioritizedSignals:
      type: object
      properties:
        content:
