  /api/community/integrations/{integrationId}:
    patch:
      summary: Enable or disable an integration
      parameters:
        - in: path
          name: integrationId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: enabled
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityIntegration'
        '403':
          description: Community policy denied integration management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/ingest/validate:
    post:
      summary: Validate an exported report without persisting anything
      description: >-
        Dry run over a CSV export or a WhatsApp/Telegram chat export. Every row gets an
        outcome and every rejected row gets row-level errors, so a community data steward
        can fix the source file before anything is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Row-by-row validation report, nothing persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestReport'
        '400':
          description: Source is unknown, the file could not be parsed, or the payload is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Community policy denied signal import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '409':
          description: Export exceeds the row ceiling and was rejected before parsing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ingest/commit:
    post:
      summary: Import the valid rows of an export and return the same report shape
      description: >-
        Persists only the rows that passed validation. Rejected rows are reported, never
        written, and every accepted signal keeps a sourceRef plus a transformationVersion
        so a later score change can be replayed against the original input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Import report with a signalId on every accepted row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestReport'
        '400':
          description: Source is unknown, the file could not be parsed, or the payload is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Community policy denied signal import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '409':
          description: Export exceeds the row ceiling and was rejected before parsing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/integrations/events:
    post:
      summary: Fan out a civic event to every enabled matching integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishCommunityIntegrationEventRequest'
      responses:
        '200':
          description: Fan-out result with one delivery record per target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityIntegrationFanOut'
        '400':
          description: Event type or schedule is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Community policy denied integration management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/integrations/deliveries/{deliveryId}/retry:
    post:
      summary: Retry a failed delivery
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery attempt after retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityIntegrationDelivery'
        '403':
          description: Community policy denied integration management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '409':
          description: Delivery was not failed, or automatic retry is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    IngestSource:
      type: string
      enum: [CSV_EXPORT, WHATSAPP_EXPORT, TELEGRAM_EXPORT]
      description: >-
        Where the file came from. Each source has its own reader and its own set of
        recognised columns; anything unrecognised fails loudly rather than guessing.
    IngestRequest:
      type: object
      required: [communityId, source, fileName, content]
      properties:
        communityId:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/IngestSource'
        fileName:
          type: string
          description: Original name, preserved in sourceRef as file#line for audit.
        content:
          type: string
          description: Raw file contents. Callers must not anonymise before ingest; redaction runs on publish.
        commit:
          type: boolean
          default: false
          description: >-
            Ignored on both routes. /validate never persists; /commit always does.
            Kept so a single client payload can drive both calls.
    IngestFieldError:
      type: object
      properties:
        rowIndex:
          type: integer
          description: 1-based row in the file, where row 1 is the header.
        field:
          type: string
          description: Column name, or "*" when the problem is the row shape itself.
        code:
          type: string
          enum: [REQUIRED, TOO_SHORT, TOO_LONG, NOT_A_NUMBER, OUT_OF_RANGE, UNKNOWN_CATEGORY, COLUMN_COUNT_MISMATCH]
        message:
          type: string
          description: Plain-language explanation the steward can act on.
        preview:
          type: string
          description: Truncated value preview, never the full row.
    IngestRowOutcome:
      type: object
      properties:
        rowIndex:
          type: integer
        valid:
          type: boolean
        sourceRef:
          type: string
          description: Present only when the row can be cited, as file#line.
        signalId:
          type: string
          format: uuid
          description: Present only after a successful commit.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/IngestFieldError'
    IngestReport:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/IngestSource'
        committed:
          type: boolean
        totalRows:
          type: integer
        acceptedRows:
          type: integer
        rejectedRows:
          type: integer
        detectedColumns:
          type: array
          items:
            type: string
        contentSha256:
          type: string
          description: >-
            Hash of the exact bytes submitted, so the same file can be shown to have
            produced the same report.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/IngestRowOutcome'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/IngestFieldError'
        errorsTruncated:
          type: boolean
          description: >-
            True when the flat error list hit its display cap. Every row still keeps its
            own full error list in outcomes, so nothing is lost.
        formula:
          $ref: '#/components/schemas/PrioritizationFormula'
        formulaVersion:
          type: string
          description: Version of the scoring formula the report was scored with.
        scoredAt:
          type: string
          format: date-time
        error:
          type: string
          description: Set instead of row results when the file itself could not be parsed.
    PublicDataAnonymizationFieldCheck:
      type: object
      description: One free-text field in a public dataset and whether it currently carries PII.
      properties:
        exportType:
          type: string
          description: Which dataset the field belongs to, so findings are attributable.
        field:
          type: string
        clean:
          type: boolean
          description: True when no record in this field carries a detectable pattern.
        recordsScanned:
          type: integer
        recordsWithFindings:
          type: integer
        categories:
          type: array
          description: Which patterns were detected, e.g. EMAIL, PHONE, NATIONAL_ID, PAYMENT_CARD.
          items:
            type: string
        exampleFindings:
          type: array
          description: >-
            Up to three truncated examples, so a steward knows what to look at without the
            checklist itself becoming the leak it is warning about.
          items:
            type: string
    PublicDataAnonymizationChecklist:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
          description: Freshness marker, per the dashboard-freshness rule.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PublicDataAnonymizationFieldCheck'
        blockingFindings:
          type: array
          description: One human-readable line per field that is not clean.
          items:
            type: string
        publishable:
          type: boolean
          description: >-
            True when no field carries a detectable pattern. Minting an open-data token is
            refused while this is false, unless the request sets acknowledgeResidualRisk.
        categories:
          type: array
          description: The full set of patterns the redactor can detect.
          items:
            type: string
    TransparencyMetric:
      type: object
      description: >-
        One measured figure with its previous-period value attached. A number in a transparency
        report only means something next to the number before it, so the delta travels with the
        figure rather than being computed by whatever renders it.
      properties:
        key:
          type: string
          example: MEDIAN_RESOLUTION_DAYS
        label:
          type: string
        value:
          type: integer
        unit:
          type: string
          enum: [count, days]
        previousValue:
          type: integer
          description: Null only when no prior period exists to compare against.
        delta:
          type: integer
        direction:
          type: string
          enum: [UP, DOWN, FLAT, BASELINE]
    TransparencySignalOutcome:
      type: object
      description: A single signal named in the report, either actioned or still unaddressed.
      properties:
        signalId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
        category:
          type: string
        priorityScore:
          type: number
        locationLabel:
          type: string
        daysOpen:
          type: integer
          description: >-
            Measured to the end of the reported period for an unresolved signal, not to today.
            Measuring to today would change the figure on every regeneration, which is the
            non-determinism this report exists to avoid.
        reportedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    TransparencyReport:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        period:
          type: object
          properties:
            key:
              type: string
              example: 2026-03
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
              description: Exclusive upper bound.
            previous:
              type: object
              nullable: true
              description: The comparison month, null only for the first report.
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/TransparencyMetric'
        actioned:
          type: array
          description: Resolved during the period, fastest first.
          items:
            $ref: '#/components/schemas/TransparencySignalOutcome'
        unaddressed:
          type: array
          description: >-
            Reported in the period and still open at period end, highest priority first. Named
            deliberately: a report that lists only wins is marketing, and this list is what a
            resident uses to judge whether the institution is keeping up.
          items:
            $ref: '#/components/schemas/TransparencySignalOutcome'
        narrative:
          type: array
          items:
            type: string
        formulaVersion:
          type: string
          description: Scoring formula the figures were produced under, for reproducibility.
        generatedAt:
          type: string
          format: date-time
          description: >-
            When the report was generated. The only field that varies between two runs over the
            same period.
        complete:
          type: boolean
    MunicipalTicketField:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          description: Column type as a city importer would declare it, e.g. decimal(5,2).
        description:
          type: string
    MunicipalTicketRecord:
      type: object
      description: >-
        One ticket. No author id, account, or contact details: a ticket export leaves the
        platform, so the redacted view is the only one that leaves.
      properties:
        ticketRef:
          type: string
          description: >-
            Stable citation derived from the signal id. Deterministic, so regenerating an export
            does not invent new references and cost the city their ticket history.
          example: OCS-9F2A1C4B7D3E5A60
        externalCategoryCode:
          type: string
          description: City service code, or an UNMAPPED. prefix when the category is not mapped.
        title:
          type: string
        description:
          type: string
        location:
          type: string
          description: >-
            Free-text location label. Never coordinates: the precise location of a private home
            is a safety risk, not a routing convenience.
        status:
          type: string
        priorityScore:
          type: number
          description: >-
            Platform prioritisation score, provided as context. Explicitly NOT the city's own
            priority field.
        reportedAt:
          type: string
          format: date-time
        sourceChannel:
          type: string
          nullable: true
          description: How the report entered the platform, for provenance.
        sourceRef:
          type: string
          nullable: true
          description: File and line for an imported report, for provenance.
        platformUrl:
          type: string
          description: Link back to the public signal page.
    MunicipalTicketUnmappedCategory:
      type: object
      properties:
        category:
          type: string
        platformLabel:
          type: string
        affectedReports:
          type: integer
          description: How many reports this exclusion is currently costing.
        guidance:
          type: string
    MunicipalTicketExportRequest:
      type: object
      required: [communityId]
      properties:
        communityId:
          type: string
          format: uuid
        categoryMap:
          type: object
          description: >-
            Translation from platform categories to city service codes, supplied per request
            rather than stored. The codes belong to one city's helpdesk, and a stored mapping
            would keep applying after the city renames a service.
          additionalProperties:
            type: string
          example:
            infrastructure: SRV-ROADS-01
            utilities: SRV-WATER-04
        includeUnmapped:
          type: boolean
          default: false
          description: >-
            Export unmapped categories under an UNMAPPED. prefix instead of excluding them. The
            exclusions are still reported either way.
    MunicipalTicketExport:
      type: object
      properties:
        communityId:
          type: string
          format: uuid
        fieldMap:
          type: array
          description: Ships with every export so the columns are self-describing.
          items:
            $ref: '#/components/schemas/MunicipalTicketField'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/MunicipalTicketRecord'
        unmappedCategories:
          type: array
          items:
            $ref: '#/components/schemas/MunicipalTicketUnmappedCategory'
        exportedCount:
          type: integer
        excludedCount:
          type: integer
        categoryMap:
          type: object
          additionalProperties:
            type: string
    SurgeWindow:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: Exclusive.
        count:
          type: integer
          format: int64
    SurgeZone:
      type: object
      description: >-
        One zone's assessment with every input the verdict came from. The unit is community plus
        category: the platform has no validated neighbourhood geography, since locationLabel is
        free text written by residents and does not group reliably.
      properties:
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        category:
          type: string
        currentCount:
          type: integer
          format: int64
        baselineMedian:
          type: integer
          format: int64
          description: >-
            Median, not mean, of the baseline windows. A median does not move for one outlier
            window, which is exactly the spike being looked for.
        ratio:
          type: number
          description: currentCount divided by baselineMedian. Rendered as no-baseline when zero.
        verdict:
          type: string
          enum: [SURGE, STABLE, SUPPRESSED_LOW_VOLUME]
        reason:
          type: string
          description: The comparison and the threshold crossed, in plain language.
        baselineCounts:
          type: array
          description: >-
            The individual windows, so a human can check the median rather than trusting it.
          items:
            $ref: '#/components/schemas/SurgeWindow'
    SurgeReport:
      type: object
      properties:
        version:
          type: string
          example: v1
        thresholds:
          type: object
          properties:
            baselineWindows:
              type: integer
            minCurrentCount:
              type: integer
            surgeMultiplier:
              type: number
        windowEnd:
          type: string
          format: date
        windowDays:
          type: integer
        baselinePeriods:
          type: array
          description: Baseline window layout. Counts are zero here; the per-zone figures carry them.
          items:
            $ref: '#/components/schemas/SurgeWindow'
        surges:
          type: array
          description: Zones flagged as surging, highest ratio first.
          items:
            $ref: '#/components/schemas/SurgeZone'
        zonesEvaluated:
          type: array
          items:
            $ref: '#/components/schemas/SurgeZone'
        zonesConsidered:
          type: integer
        zonesSuppressedByMinVolume:
          type: integer
          description: >-
            How many zones were excluded by the absolute floor. Surfaced rather than hidden,
            since a suppressed zone is still a zone someone might be waiting on.
        generatedAt:
          type: string
          format: date-time
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
    CommunityPermissionDeniedError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [code, communityId, permissionScope, currentRole, allowedRoles]
          properties:
            code:
              type: string
              enum: [COMMUNITY_PERMISSION_DENIED]
            communityId:
              type: string
              format: uuid
            permissionScope:
              type: string
              enum:
                - CREATE_PROPOSAL

                - IMPORT_SIGNALS
                
                - MANAGE_MODERATION_QUEUE
                - MANAGE_PRIVACY_SETTINGS
                - MANAGE_DECISION_LEDGER
                - MANAGE_GOVERNANCE_LIBRARY
                - MANAGE_PROJECT_BOARDS
                - CREATE_THREAD
                - ADD_THREAD_MESSAGE
                - MODERATE_THREAD_MESSAGE
                - POST_ROOM_MESSAGE
                - MANAGE_ROOMS
                - JOIN_ACTIVITIES
                - MANAGE_ACTIVITIES
                - BOOK_RESOURCES
                - MANAGE_RESOURCES
                - MANAGE_INTEGRATIONS
                - CREATE_OFFICIAL_UPDATE
                - UPDATE_OFFICIAL_UPDATE
                - MANAGE_MEMBERSHIPS
                - MANAGE_PERMISSION_POLICIES
                - VIEW_SENSITIVE_DATA
            currentRole:
              type: string
              enum: [MEMBER, MODERATOR, COORDINATOR, PUBLIC_SERVANT_LIAISON]
            allowedRoles:
              type: array
              items:
                type: string
                enum: [MEMBER, MODERATOR, COORDINATOR, PUBLIC_SERVANT_LIAISON]
    Notification:
      type: object
      properties:
        id:
          type: string
        channel:
          type: string
          enum: [WHATSAPP, TELEGRAM, EMAIL]
        message:
          type: string
        sentAt:
          type: string
          format: date-time
        recipientGroup:
          type: string
    ScoreBreakdown:
      type: object
      required:
        - urgency
        - impact
        - affectedPeople
        - communityVotes
      properties:
        urgency:
          type: number
        impact:
          type: number
        affectedPeople:
          type: number
        communityVotes:
          type: number
    PrioritizedSignal:
      type: object
      required:
        - id
        - title
        - category
        - scoreBreakdown
        - priorityScore
        - status
        - explainabilitySummary
      properties:
        id:
          type: string
        title:
          type: string
        category:
          type: string
        scoreBreakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        priorityScore:
          type: number
        status:
          type: string
          enum: [NEW, IN_PROGRESS, RESOLVED]
        explainabilitySummary:
          $ref: '#/components/schemas/ExplainabilitySummary'
    PagedPrioritizedSignals:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PrioritizedSignal'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
    SignalResponse:
      type: object
      required:
        - id
        - title
        - description
        - category
        - status
        - priorityScore
        - scoreBreakdown
        - explainabilitySummary
        - latitude
        - longitude
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        assignedToUsername:
          type: string
        locationLabel:
          type: string
        evidenceUrls:
          type: array
          items:
            type: string
        category:
          type: string
        status:
          type: string
        priorityScore:
          type: number
        scoreBreakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        communityVotes:
          type: integer
        reactions:
          type: object
          additionalProperties:
            type: integer
        viewerReaction:
          type: string
        explainabilitySummary:
          $ref: '#/components/schemas/ExplainabilitySummary'
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        sourceChannel:
          $ref: '#/components/schemas/SignalSourceChannel'
        sourceRef:
          type: string
          nullable: true
          description: Pointer back to the original record, e.g. a CSV row or a municipal ticket
        transformationVersion:
          type: string
          description: Scoring rule version that produced this priority score
    SignalSourceChannel:
      type: string
      description: Where the signal entered the system, so an audit can tell a citizen report from an institutional update
      enum: [WEB_FORM, CSV_IMPORT, CHAT_EXPORT, PUBLIC_API, INSTITUTIONAL_UPDATE]
    SignalSlaRisk:
      type: string
      enum: [ON_TRACK, AT_RISK, BREACHED]
    SignalAgingBucket:
      type: object
      required: [bucket, count]
      properties:
        bucket:
          type: string
          enum: [FRESH_0_7, AGING_7_14, STALE_14_PLUS, OVERDUE]
        count:
          type: integer
          format: int64
    SignalAgingItem:
      type: object
      required: [id, title, category, status, priorityScore, ageDays, slaTargetDays, slaRisk, daysOverTarget, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          type: string
        status:
          type: string
        priorityScore:
          type: number
        ageDays:
          type: integer
          format: int64
        slaTargetDays:
          type: integer
          format: int64
        slaRisk:
          $ref: '#/components/schemas/SignalSlaRisk'
        daysOverTarget:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    SignalAgingTrendPoint:
      type: object
      required: [date, created, resolved]
      properties:
        date:
          type: string
          format: date
        created:
          type: integer
          format: int64
        resolved:
          type: integer
          format: int64
    SignalAging:
      type: object
      required: [generatedAt, slaTargetDays, unresolvedCount, atRiskCount, breachedCount, medianAgeDays, ageBuckets, atRiskSignals, trend]
      properties:
        communityId:
          type: string
          format: uuid
          nullable: true
        generatedAt:
          type: string
          format: date-time
          description: Freshness timestamp for the whole payload
        slaTargetDays:
          type: integer
          format: int64
        unresolvedCount:
          type: integer
          format: int64
        atRiskCount:
          type: integer
          format: int64
        breachedCount:
          type: integer
          format: int64
        medianAgeDays:
          type: integer
          format: int64
        ageBuckets:
          type: array
          items:
            $ref: '#/components/schemas/SignalAgingBucket'
        atRiskSignals:
          type: array
          description: Unresolved cases that are at risk or breached, worst first
          items:
            $ref: '#/components/schemas/SignalAgingItem'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/SignalAgingTrendPoint'
    FormulaWeight:
      type: object
      required: [factor, input, expression, cap]
      properties:
        factor:
          type: string
          enum: [urgency, impact, affectedPeople, communityVotes]
        input:
          type: string
          description: The raw signal field this factor reads
