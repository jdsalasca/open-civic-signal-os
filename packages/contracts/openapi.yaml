openapi: 3.0.3
info:
  title: Open Civic Signal OS API
  version: 0.2.0
paths:
  /api/auth/profile/me:
    get:
      summary: Get full civic identity profile for authenticated user
      responses:
        '200':
          description: Full authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    put:
      summary: Update civic identity profile for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Updated full authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
  /api/auth/profile/{username}:
    get:
      summary: Get civic identity profile filtered by viewer audience
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audience-filtered civic identity profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: API up
          content:
            text/plain:
              schema:
                type: string
  /api/signals/prioritized:
    get:
      summary: Get prioritized civic backlog
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          required: false
          description: Optional comma-separated lifecycle status filter (for example `NEW` or `NEW,IN_PROGRESS`).
          schema:
            type: string
            example: NEW
        - name: X-Community-Id
          in: header
          schema:
            type: string
            format: uuid
          required: false
      responses:
        '200':
          description: Paginated prioritized list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/top-10:
    get:
      summary: Get top 10 unresolved civic problems
      parameters:
        - name: X-Community-Id
          in: header
          schema:
            type: string
            format: uuid
          required: false
      responses:
        '200':
          description: List of top signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrioritizedSignal'
  /api/signals/{id}:
    get:
      summary: Get one civic signal detail by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '400':
          description: Invalid signal ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/meta:
    get:
      summary: Get aggregate metadata for current signal scope
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregated signal metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalMeta'
  /api/signals/mine:
    get:
      summary: Get signals created by the authenticated user
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated self-reported signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/{id}/vote:
    post:
      summary: Cast support vote for a signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated signal after vote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals:
    post:
      summary: Create a civic signal
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalCreateRequest'
      responses:
        '200':
          description: Created signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/{id}/status:
    patch:
      summary: Update signal lifecycle status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalStatusUpdateRequest'
      responses:
        '200':
          description: Updated signal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/{id}/history:
    get:
      summary: Get status transition history for one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal status history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignalStatusEntry'
  /api/signals/{id}/trust-packet:
    get:
      summary: Get trust packet with score formula and verification hash
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trust packet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustPacket'
  /api/signals/{id}/comments:
    get:
      summary: List comments for one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CivicComment'
    post:
      summary: Add comment to one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CivicCommentCreateRequest'
      responses:
        '200':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CivicComment'
  /api/signals/{id}/react:
    post:
      summary: Toggle reaction state for one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: Updated reactions and viewer state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionState'
  /api/signals/flagged:
    get:
      summary: List flagged signals for moderation queue
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated flagged signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/{id}/moderate:
    post:
      summary: Moderate one signal (approve/reject with reason)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalModerationRequest'
      responses:
        '200':
          description: Moderated signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/duplicates:
    get:
      summary: Find near-duplicate signals
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicate clusters keyed by canonical signal ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/SignalResponse'
  /api/signals/merge:
    post:
      summary: Merge duplicate signals into one target
      parameters:
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: Merged signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/export/csv:
    get:
      summary: Export full civic intelligence as CSV (super admin only)
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
  /api/notifications/recent:
    get:
      summary: Get recent outgoing notification relays
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /api/communities:
    get:
      summary: List available communities
      responses:
        '200':
          description: Community catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Community'
    post:
      summary: Create community and auto-assign creator as coordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunityRequest'
      responses:
        '200':
          description: Created community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Community'
  /api/communities/tree:
    get:
      summary: List communities as a hierarchical tree
      responses:
        '200':
          description: Community hierarchy tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityTreeNode'
  /api/communities/{communityId}/breadcrumb:
    get:
      summary: Get breadcrumb path for one community
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered path from root community to selected community
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityBreadcrumbItem'
  /api/communities/my:
    get:
      summary: Get memberships for current user
      responses:
        '200':
          description: Membership list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityMembership'
  /api/communities/{communityId}/join:
    post:
      summary: Join a community with selected role
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCommunityRequest'
      responses:
        '200':
          description: Membership created/returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMembership'
  /api/communities/{communityId}/memberships/{userId}/role:
    patch:
      summary: Update community role for a member using community policy scope
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityRoleRequest'
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMembership'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/communities/{communityId}/permissions:
    get:
      summary: List effective permission policies for one community
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Effective permission matrix including defaults and overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPermissionPolicy'
        '401':
          description: User is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: Update permission policies for one community
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityPermissionPoliciesRequest'
      responses:
        '200':
          description: Updated effective permission matrix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPermissionPolicy'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/communities/{communityId}/switch:
    post:
      summary: Validate and activate community context
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Context activated
        '403':
          description: User not member of community
  /api/community/threads:
    get:
      summary: List inter-community threads
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [ACTIVE, STALE]
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            enum: [RELEVANCE, RECENT]
            default: RELEVANCE
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated thread list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCommunityThreads'
    post:
      summary: Create a cross-community thread linked to an optional signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunityThreadRequest'
      responses:
        '200':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThreadResponse'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/threads/{threadId}/messages:
    post:
      summary: Add message to thread
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunityThreadMessageRequest'
      responses:
        '200':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThreadMessageResponse'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/threads/{threadId}/messages/{messageId}/moderate:
    patch:
      summary: Hide or unhide thread message
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateThreadMessageRequest'
      responses:
        '200':
          description: Message moderated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThreadMessageResponse'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/threads/{threadId}/messages/{messageId}/react:
    post:
      summary: Toggle reaction on one thread message
      parameters:
        - in: path
          name: threadId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: Updated message reaction state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityThreadMessageResponse'
  /api/community/blog:
    get:
      summary: List active official announcements for one community
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Blog timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityBlogPost'
    post:
      summary: Create official announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunityBlogPostRequest'
      responses:
        '200':
          description: Blog post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityBlogPost'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/blog/archive:
    get:
      summary: Search archived official announcements
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: query
          required: false
          schema:
            type: string
        - in: query
          name: dateFrom
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Archived announcement results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityBlogPost'
  /api/community/blog/{id}/comments:
    get:
      summary: List comments for one community blog post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Blog comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CivicComment'
    post:
      summary: Add comment to one community blog post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CivicCommentCreateRequest'
      responses:
        '200':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CivicComment'
  /api/community/blog/{id}/react:
    post:
      summary: Toggle reaction state for one community blog post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: Updated reactions and viewer state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionState'
  /api/community/blog/{postId}:
    put:
      summary: Update official announcement
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityBlogPostRequest'
      responses:
        '200':
          description: Blog post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityBlogPost'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/blog/{postId}/archive:
    patch:
      summary: Archive or restore official announcement
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveCommunityBlogPostRequest'
      responses:
        '200':
          description: Updated archived state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityBlogPost'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/blog/comments/count:
    get:
      summary: Get comment counts for a set of blog post IDs
      parameters:
        - in: query
          name: postIds
          required: true
          schema:
            type: array
            items:
              type: string
              format: uuid
            style: form
            explode: false
      responses:
        '200':
          description: Map of post ID to comment count
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
  /api/community/feed:
    get:
      summary: Unified cross-community feed
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: days
          required: false
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Typed feed list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityFeedItem'
components:
  schemas:
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
