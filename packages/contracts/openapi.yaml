openapi: 3.0.3
info:
  title: Open Civic Signal OS API
  version: 0.2.0
paths:
  /api/auth/profile/me:
    get:
      summary: Get full civic identity profile for authenticated user
      responses:
        '200':
          description: Full authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    put:
      summary: Update civic identity profile for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Updated full authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
  /api/auth/profile/{username}:
    get:
      summary: Get civic identity profile filtered by viewer audience
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audience-filtered civic identity profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '404':
          description: Identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/privacy/access-logs:
    get:
      summary: List the authenticated user's recent sensitive-data access events
      responses:
        '200':
          description: Recent sensitive-data access events for the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensitiveDataAccessLogResponse'
  /api/help-center:
    get:
      summary: Get backend-owned onboarding steps and bilingual help guides for the authenticated user
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          required: false
          schema:
            type: string
            example: en
        - name: surface
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HelpSurface'
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Onboarding state and help guides for the current audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpCenterResponse'
  /api/help-center/state:
    put:
      summary: Update backend-owned onboarding completion and dismissed-guide state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHelpCenterStateRequest'
      responses:
        '200':
          description: Persisted onboarding and guide-dismissal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpCenterStateResponse'
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: API up
          content:
            text/plain:
              schema:
                type: string
  /api/signals/prioritized:
    get:
      summary: Get prioritized civic backlog
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          required: false
          description: Optional comma-separated lifecycle status filter (for example `NEW` or `NEW,IN_PROGRESS`).
          schema:
            type: string
            example: NEW
        - name: X-Community-Id
          in: header
          schema:
            type: string
            format: uuid
          required: false
      responses:
        '200':
          description: Paginated prioritized list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/top-10:
    get:
      summary: Get top 10 unresolved civic problems
      parameters:
        - name: X-Community-Id
          in: header
          schema:
            type: string
            format: uuid
          required: false
      responses:
        '200':
          description: List of top signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrioritizedSignal'
  /api/signals/{id}:
    get:
      summary: Get one civic signal detail by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '400':
          description: Invalid signal ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/meta:
    get:
      summary: Get aggregate metadata for current signal scope
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregated signal metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalMeta'
  /api/signals/formula:
    get:
      summary: Get the published prioritization formula, its version, and per-factor weights
      responses:
        '200':
          description: Published prioritization formula metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrioritizationFormula'
  /api/signals/surges:
    get:
      summary: Surge and trend detection per community category
      description: >-
        Compares the current window against a baseline median of the preceding windows and
        reports a surge only when the ratio is at or above threshold AND the absolute volume is
        meaningful. Every result carries the individual baseline windows and a plain-language
        reason, because a surge badge a human cannot check is the black box this project exists
        to avoid.
      parameters:
        - in: query
          name: allowGlobal
          description: Allow analytics across all communities when the caller has no membership.
          schema:
            type: boolean
            default: false
        - in: query
          name: windowDays
          description: Length of the current and baseline windows, in days.
          schema:
            type: integer
            default: 7
        - in: query
          name: baselineWindows
          description: How many preceding windows form the baseline.
          schema:
            type: integer
            default: 4
        - in: query
          name: minCurrentCount
          description: >-
            Absolute floor below which no percentage change is reported. Without it a quiet zone
            going from one report to three is a 300% surge, and a dashboard full of those teaches
            people to ignore the marker.
          schema:
            type: integer
            default: 5
        - in: query
          name: surgeMultiplier
          description: Ratio at or above which a zone is flagged.
          schema:
            type: number
            default: 2.0
        - in: query
          name: windowEnd
          description: >-
            Exclusive end of the current window, ISO date. Defaults to today. Supplying it makes
            the whole report reproducible.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Surge report with per-zone arithmetic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeReport'
        '400':
          description: A threshold is out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/surges/formula:
    get:
      summary: Surge detection formula and default thresholds
      description: >-
        The versioned formula on its own, so a dashboard can show how a verdict was reached
        without fetching every zone.
      parameters:
        - in: query
          name: allowGlobal
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Formula version, default thresholds, and baseline window layout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurgeReport'
  /api/signals/aging:
    get:
      summary: Get backend-owned case aging buckets, SLA risk, and the created/resolved trend
      parameters:
        - in: query
          name: communityId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: slaTargetDays
          required: false
          schema:
            type: integer
            minimum: 1
            default: 30
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case aging and SLA risk payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalAging'
        '401':
          description: User is not a member of the requested community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/map:
    get:
      summary: Get one community map with mapped issue points, clusters, and coverage counters
      parameters:
        - name: communityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Optional comma-separated lifecycle status filter.
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Community issue map payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitySignalMap'
  /api/signals/map/heat:
    get:
      summary: Get heat summary across visible communities
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Optional comma-separated lifecycle status filter.
          schema:
            type: string
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cross-community heat map payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunitySignalsHeatMap'
  /api/signals/mine:
    get:
      summary: Get signals created by the authenticated user
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated self-reported signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/{id}/vote:
    post:
      summary: Cast support vote for a signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated signal after vote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals:
    post:
      summary: Create a civic signal
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalCreateRequest'
      responses:
        '200':
          description: Created signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/{id}/status:
    patch:
      summary: Update signal lifecycle status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalStatusUpdateRequest'
      responses:
        '200':
          description: Updated signal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
        '404':
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/signals/{id}/assign:
    patch:
      summary: Assign one signal to an institutional owner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignSignalRequest'
      responses:
        '200':
          description: Updated signal assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/{id}/history:
    get:
      summary: Get status transition history for one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal status history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignalStatusEntry'
  /api/signals/{id}/trust-packet:
    get:
      summary: Get trust packet with score formula and verification hash
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trust packet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustPacket'
  /api/signals/{id}/comments:
    get:
      summary: List comments for one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Signal comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CivicComment'
    post:
      summary: Add comment to one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CivicCommentCreateRequest'
      responses:
        '200':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CivicComment'
  /api/signals/{id}/react:
    post:
      summary: Toggle reaction state for one signal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
      responses:
        '200':
          description: Updated reactions and viewer state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionState'
  /api/signals/flagged:
    get:
      summary: List flagged signals for moderation queue
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated flagged signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPrioritizedSignals'
  /api/signals/{id}/moderate:
    post:
      summary: Moderate one signal (approve/reject with reason)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalModerationRequest'
      responses:
        '200':
          description: Moderated signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/duplicates:
    get:
      summary: Find near-duplicate signals
      parameters:
        - name: X-Community-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duplicate clusters keyed by canonical signal ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/SignalResponse'
  /api/signals/merge:
    post:
      summary: Merge duplicate signals into one target
      parameters:
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
      responses:
        '200':
          description: Merged signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalResponse'
  /api/signals/export/csv:
    get:
      summary: Export full civic intelligence as CSV (super admin only)
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
  /api/notifications/recent:
    get:
      summary: Get recent outgoing notification relays
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /api/notifications/relay/top-10:
    post:
      summary: Trigger the weekly top-10 unresolved problems relay to configured community channels
      responses:
        '200':
          description: Relay accepted for delivery
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Caller is not permitted to trigger a relay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/communities:
    get:
      summary: List available communities
      responses:
        '200':
          description: Community catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Community'
    post:
      summary: Create community and auto-assign creator as coordinator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommunityRequest'
      responses:
        '200':
          description: Created community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Community'
  /api/communities/tree:
    get:
      summary: List communities as a hierarchical tree
      responses:
        '200':
          description: Community hierarchy tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityTreeNode'
  /api/communities/{communityId}/breadcrumb:
    get:
      summary: Get breadcrumb path for one community
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered path from root community to selected community
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityBreadcrumbItem'
  /api/communities/my:
    get:
      summary: Get memberships for current user
      responses:
        '200':
          description: Membership list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityMembership'
  /api/communities/{communityId}/join:
    post:
      summary: Join a community with selected role
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCommunityRequest'
      responses:
        '200':
          description: Membership created/returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMembership'
  /api/communities/{communityId}/memberships/{userId}/role:
    patch:
      summary: Update community role for a member using community policy scope
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityRoleRequest'
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityMembership'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/communities/{communityId}/permissions:
    get:
      summary: List effective permission policies for one community
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Effective permission matrix including defaults and overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPermissionPolicy'
        '401':
          description: User is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: Update permission policies for one community
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityPermissionPoliciesRequest'
      responses:
        '200':
          description: Updated effective permission matrix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPermissionPolicy'
        '403':
          description: Community policy denied the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/communities/{communityId}/privacy:
    get:
      summary: Get one community privacy and publication policy with recent sensitive access
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Community privacy policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPrivacyPolicyResponse'
        '403':
          description: Community policy denied privacy management access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
    put:
      summary: Update one community privacy and publication policy
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommunityPrivacyPolicyRequest'
      responses:
        '200':
          description: Updated community privacy policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPrivacyPolicyResponse'
        '403':
          description: Community policy denied privacy management access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/communities/{communityId}/switch:
    post:
      summary: Validate and activate community context
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Context activated
        '403':
          description: User not member of community
  /api/community/threads:
    get:
      summary: List inter-community threads
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [ACTIVE, STALE]
        - in: query
          name: sortBy
          required: false
