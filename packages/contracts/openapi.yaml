              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MunicipalTicketField'
  /api/community/exports/municipal-tickets:
    post:
      summary: Export signals as municipal tickets
      description: >-
        Translates community signals into the shape a city helpdesk ingests. Categories with no
        city service code are reported and excluded rather than defaulted, because a report filed
        against the wrong service code reaches the wrong department and then stops being chased.
        Personal contact details are redacted, since the destination is a system this platform
        does not control.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalTicketExportRequest'
      responses:
        '200':
          description: Tickets plus the field map and any categories left out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalTicketExport'
        '400':
          description: Request body is missing communityId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Community policy denied open-data export management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Community not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/exports/anonymization-check:
    get:
      summary: Pre-publication anonymization checklist for public open data
      description: >-
        Scans the free text that a public export would carry and reports, per field, how many
        records contain an email address, phone number, national id, or payment card. Personal
        data is redacted on the way out, but redaction loses information a community may want
        to keep, so the step is made visible rather than silently applied.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Checklist with a blocking-findings list and a publishable verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataAnonymizationChecklist'
        '403':
          description: Community policy denied open-data export management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/exports/{exportType}:
    get:
      summary: Download one community-scoped export dataset as CSV or JSON
      parameters:
        - in: path
          name: exportType
          required: true
          schema:
            $ref: '#/components/schemas/CommunityOpenDataExportType'
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: format
          required: false
          schema:
            $ref: '#/components/schemas/CommunityOpenDataFormat'
      responses:
        '200':
          description: Open-data dataset download
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataSignalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataProposalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataVoteRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataDecisionRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataMetricRecordResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          description: Community policy denied open-data export download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/open-data/{communityId}/{exportType}:
    get:
      summary: Read one community open-data dataset through a scoped external API token
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: exportType
          required: true
          schema:
            $ref: '#/components/schemas/CommunityOpenDataExportType'
        - in: header
          name: X-Api-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scoped open-data dataset payload
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataSignalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataProposalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataVoteRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataDecisionRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataMetricRecordResponse'
        '401':
          description: Token missing, invalid, revoked, or missing the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Scoped token exceeded its rate limit window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
  /api/community/backlog-publications:
    post:
      summary: Publish the current backlog as a hash-anchored artifact
      description: >-
        Freezes the current ranked backlog into an explainability snapshot and records a hash of
        the published set, so a visitor can later ask whether what they are looking at is still
        what was published. Publishing declares what the public sees, so it is a moderation act.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacklogPublicationRequest'
      responses:
        '200':
          description: Publication with its ordering hash and the snapshot it froze
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogPublication'
        '400':
          description: Label is blank, or limit is out of range. Both would make a publication unfindable or oversized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
    get:
      summary: Publication history for a community, newest first
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Publications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BacklogPublication'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/backlog-publications/current:
    get:
      summary: The publication the public backlog is currently serving, with a live comparison
      description: >-
        Public. This is the claim a visitor checks, so it cannot require an account. Returns null
        when nothing has been published.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current publication, or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogPublication'
  /api/community/backlog-publications/verify:
    get:
      summary: Compare the live ranking against the published one
      description: >-
        Public, because a check only its publisher can run is not one a visitor can trust. Recomputes
        the ordering hash over the live ranking and compares. The hash covers the set of signals and
        their scores, not the order they appear in: rows with equal scores have no defined order, so
        hashing their literal order would fail for a reason nobody can act on.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Both hashes and what the mismatch means
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogPublicationVerification'
        '404':
          description: Nothing has been published for this community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/backlog-publications/history:
    get:
      summary: Every publication for a community, newest first
      description: >-
        The record of what was published when. Gated on the open-data management scope, unlike the
        current publication and its verification, because the history is bookkeeping rather than the
        claim a visitor checks.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Publications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BacklogPublication'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/assemblies:
    post:
      summary: Convene an assembly
      description: >-
        Records what a community will deliberate over. The evidence snapshot is attached separately,
        because it is usually captured closer to the meeting and forcing it at creation would make
        people create a placeholder snapshot. A placeholder in an evidence chain is worse than an
        honest gap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssemblyRequest'
      responses:
        '200':
          description: The assembly, with evidenceCaptured false until a snapshot is attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityAssembly'
        '400':
          description: Missing title or scheduled time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
    get:
      summary: Every assembly for a community, newest scheduled first
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assemblies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityAssembly'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/assemblies/{assemblyId}:
    get:
      summary: One assembly with its evidence link and recorded decisions
      parameters:
        - in: path
          name: assemblyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The assembly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityAssembly'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Assembly not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/assemblies/{assemblyId}/evidence:
    post:
      summary: Attach the frozen ranking the assembly will deliberate over
      description: >-
        Refused once the assembly is closed, because attaching evidence afterwards would change what
        the record says was deliberated over.
      parameters:
        - in: path
          name: assemblyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: snapshotId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The assembly with evidenceCaptured true and the snapshot content hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityAssembly'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Assembly or snapshot not found for this community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The assembly is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/assemblies/{assemblyId}/open:
    post:
      summary: Open an assembly for deliberation
      parameters:
        - in: path
          name: assemblyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The open assembly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityAssembly'
        '409':
          description: Already open or already closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/assemblies/{assemblyId}/close:
    post:
      summary: Close an assembly, optionally recording minutes
      description: >-
        Refused if already closed, because reopening would erase the record of when it ended. The
        minutes are free text and are not the official record.
      parameters:
        - in: path
          name: assemblyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The closed assembly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityAssembly'
        '409':
          description: Already closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/assemblies/{assemblyId}/decisions:
    post:
      summary: Record a decision the assembly made
      description: >-
        The platform records decisions people made; it does not make them. A rationale is required,
        because a decision nobody explained cannot be reviewed afterwards. Refused once the assembly
        is closed, since a decision recorded afterwards would appear in the record as having been
        made in the room.
      parameters:
        - in: path
          name: assemblyId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAssemblyDecisionRequest'
      responses:
        '200':
          description: The assembly with the new decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityAssembly'
        '400':
          description: Missing decision type or rationale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The assembly is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/participatory-budgets:
    post:
      summary: Create a budget envelope and read every proposal cost
      description: >-
        The platform does not hold money. It records what a community decided to allocate and
        reports whether the arithmetic closes. Every proposal in the community gets an allocation
        row with its cost read once, so a proposal edited later cannot change a past simulation.
        A cost that cannot be read as an amount is recorded as null rather than guessed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipatoryBudgetRequest'
      responses:
        '200':
          description: The envelope with every allocation and its readable or unreadable cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipatoryBudget'
        '400':
          description: >-
            Missing name, a non-positive envelope, an invalid currency code, or more proposals than
            the envelope supports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
    get:
      summary: Every budget envelope for a community, newest first
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Envelopes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipatoryBudget'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/participatory-budgets/{budgetId}:
    get:
      summary: One envelope with its allocations and whether the selection fits
      parameters:
        - in: path
          name: budgetId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipatoryBudget'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Envelope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/participatory-budgets/{budgetId}/selection:
    post:
      summary: Mark which proposals are funded and report whether the arithmetic closes
      description: >-
        Replaces the whole selection rather than toggling one at a time, so a caller cannot end up
        with a half-applied change if something fails partway. The response does not choose: which
        proposals to fund is the community decision, and the platform has no standing to make it.
      parameters:
        - in: path
          name: budgetId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proposalIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: The envelope with the new selection and its totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipatoryBudget'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Envelope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/institutional-handoffs:
    post:
      summary: Record that a report was handed to an institution
      description: >-
        Starts the community's own SLA clock for that handoff. The platform cannot read a city
        helpdesk, so this records what was sent and what the community later learns, never a live
        view of the institution's queue. A second handoff for the same signal and reference is
        refused, because two clocks for one complaint means nobody can say which one was late.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionalHandoffRequest'
      responses:
        '200':
          description: The recorded handoff with its derived SLA state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalHandoff'
        '400':
          description: >-
            Missing ticket reference or service code, an SLA target out of range, or a signal that
            belongs to another community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '409':
          description: This signal was already handed off under that reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: Every handoff for a community, with its SLA state and where that state came from
      description: >-
        The interpretation states on every response that the platform does not read the
        institution's system. An overdue handoff means the community's own target has passed, not
        that the city has failed, because the platform cannot see the city's queue.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Summary and handoffs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalBridgeSummary'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/institutional-handoffs/batch:
    post:
      summary: Hand a batch of signals to an institution in one call
      description: >-
        The municipal export is bulk, so the handoff is too. A community sending fifty tickets should
        not record fifty handoffs by hand. Partial success is the expected outcome and is reported per
        signal rather than as one verdict: a batch where three of fifty were already handed off
        records forty-seven and says which three were skipped, instead of failing entirely and leaving
        the community to work out why. The ticket reference is derived from the signal id the same way
        the export derives it, so the reference a community quotes back to a city is the one the city
        received.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionalBatchHandoffRequest'
      responses:
        '200':
          description: Per-signal outcomes and the batch totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalBatchHandoffResult'
        '400':
          description: >-
            No signals, more than 200, no category map, or an SLA target out of range. All rejected
            rather than adjusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/institutional-handoffs/{handoffId}/outcome:
    post:
      summary: Record that an institution acknowledged or resolved a ticket
      description: >-
        A declaration by a community member, not an observation. The response says so through
        statusSource, because a community reading "resolved" needs to know whether the platform
        observed that or was told it. Resolving implies acknowledging.
      parameters:
        - in: path
          name: handoffId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolved]
              properties:
                resolved:
                  type: boolean
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The updated handoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalHandoff'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Handoff not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/trust-pulse:
    post:
      summary: Answer the community trust pulse for a closed month
      description: >-
        One resident, one answer per month. Answering again replaces the previous one rather than
        stacking a second, because a pulse that counts the loudest respondent twice is not a
        measure of the community. Requires membership: someone outside a community has no standing
        to answer for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustPulseSubmission'
      responses:
        '200':
          description: Recorded, and whether it replaced a previous answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustPulseSubmissionResult'
        '400':
          description: A score is outside 1-5, the period is not YYYY-MM, or the comment is too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: Aggregate the pulse for one closed month
      description: >-
        Reports a mean per dimension only once the sample reaches the minimum. Below it, the count
        is returned and no average at all, because a mean over a handful of answers is noise and
        publishing it as a community verdict invites a decision on that noise. The interpretation
        states on every response that this measures perception from a self-selected sample, not
        what the platform did.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: period
          required: false
          description: >-
            Closed month as YYYY-MM. Defaults to the previous completed month, because on the 3rd
            the current one is three days of answers.
          schema:
            type: string
            example: 2026-03
      responses:
        '200':
          description: Aggregate with its sample size and interpretation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustPulseAggregate'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/trust-pulse/history:
    get:
      summary: Every month with responses, newest first
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aggregates, newest month first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrustPulseAggregate'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/trust-pulse/minimum-sample:
    get:
      summary: The response count below which no average is reported
      description: Published so a client can explain the floor before a resident answers, rather than after.
      responses:
        '200':
          description: Minimum responses for an average
          content:
            application/json:
              schema:
                type: integer
                example: 5
  /api/community/weekly-digest:
    get:
      summary: Generate the weekly digest for one closed ISO week
      description: >-
        Top unresolved problems and what was resolved, for a Monday-to-Sunday week addressed as
        2026-W13. The week is closed and nothing in the content reads the wall clock, so
        regenerating a past week reproduces it exactly. The top list is the open backlog as it
        stood at the END of that week, read from the status audit trail rather than the mutable
        status column, because a March digest must not absorb everything that happened since.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: week
          required: false
          description: >-
            ISO week as YYYY-Www. Defaults to the previous completed week, because on Wednesday the
            current week is three days of data and mailing that as this weeks digest would
            misdescribe the community.
          schema:
            type: string
            example: 2026-W13
        - in: query
          name: limit
          required: false
          description: How many unresolved items to list. 1-50, defaults to 10. Out-of-range values are rejected rather than clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Digest with its rendered body and content hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigest'
        '400':
          description: Week is not a recognisable ISO week, or limit is out of range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/weekly-digest/publish:
    post:
      summary: Publish a weekly digest, once per week
      description: >-
        Records the digest and its sealed body. A second publish for the same community and week is
        refused, because a weekly bulletin delivered twice is the kind of failure that costs trust
        exactly when the platform is asking for it. Delivery to a channel is not wired here.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: week
          required: false
          schema:
            type: string
            example: 2026-W13
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Published digest with its publication timestamp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyDigest'
        '409':
          description: A digest for this week was already published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/weekly-digest/history:
    get:
      summary: Published digests, newest week first
      description: >-
        Each record keeps the rendered body it sealed, so a resident can verify the digest they
        received matches what was recorded rather than a later edit.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Publication history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DigestPublication'
        '403':
          description: Caller does not hold the open-data management scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/explainability-snapshots:
    post:
      summary: Freeze the current ranked list as a verifiable snapshot
      description: >-
        Captures what a ranked list looked like at one moment, with the scoring formula version
        and a SHA-256 over the canonical payload. A live trust packet is not enough for a
        deliberation: one more vote changes the score, so the list an assembly actually voted on
        would stop existing. The snapshot is immutable and there is no update or delete route,
        because a snapshot that can be edited is not evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainabilitySnapshotCreateRequest'
      responses:
        '200':
          description: Frozen snapshot with its content hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainabilitySnapshot'
        '400':
          description: Label is blank, or limit is outside 1-200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Community not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      summary: List snapshots for a community, newest first
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Snapshots, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExplainabilitySnapshot'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/explainability-snapshots/{snapshotId}:
    get:
      summary: Retrieve one snapshot with its frozen payload
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Snapshot with its canonical payload and hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainabilitySnapshot'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Snapshot not found for this community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/explainability-snapshots/{snapshotId}/verification:
    get:
      summary: Independently verify that a snapshot's rows were not altered
      description: >-
        Recomputes the SHA-256 over the stored payload and compares it with the recorded hash.
        This deliberately does NOT regenerate the ranking from current data: the question is
        whether the stored rows were tampered with, not whether the backlog has since changed.
        Both hashes are returned so a reader can compare them rather than accept a boolean from
        the same party that produced the data.
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification result with both hashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainabilitySnapshotVerification'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Snapshot not found for this community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/freshness:
    get:
      summary: Data freshness monitoring per civic surface
      description: >-
        Every surface a community depends on, its age, and a verdict with the arithmetic behind
        it. Silence is judged against the community's own median cadence rather than a global
        threshold, and every verdict carries a cause. The cause matters: "no new reports" means
        either intake broke or the community has nothing to report, and a monitor that cannot
        distinguish them sends a responder to the wrong place. UNKNOWN is an explicit, honest
        answer rather than a silent one.
      parameters:
        - in: query
          name: allowGlobal
          description: Allow monitoring across all communities when the caller has no membership.
          schema:
            type: boolean
            default: false
        - in: query
          name: communityId
          description: Restrict to one community. Must be visible to the caller.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One freshness report per visible community
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataFreshnessReport'
        '404':
          description: Requested community is not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/transparency-report:
    get:
      summary: Monthly transparency report over a closed calendar month
      description: >-
        A report for a published month, with the previous month attached for comparison. Unlike
        the trust-metrics dashboard, which uses a rolling window so a live view reflects now,
        this is fixed to a closed month because published figures have to be reproducible. The
        same month returns the same numbers however long afterwards it is requested.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: period
          required: false
          description: >-
            Calendar month as YYYY-MM, or a full ISO date. Defaults to the previous calendar
            month rather than the current one, because on the 3rd of April the current month is
            three days of data and calling that "this month's report" would mislead.
          schema:
            type: string
            example: 2026-03
      responses:
        '200':
          description: Report for the requested closed month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransparencyReport'
        '400':
          description: Period is not a recognisable calendar month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
