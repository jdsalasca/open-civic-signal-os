      required: [id, communityId, name, description, locationLabel, requiresApproval, minNoticeHours, maxBookingHours, archived, createdBy, createdAt, upcomingBlockingCount, upcomingBookings]
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        locationLabel:
          type: string
        requiresApproval:
          type: boolean
        minNoticeHours:
          type: integer
        maxBookingHours:
          type: integer
        archived:
          type: boolean
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        upcomingBlockingCount:
          type: integer
          format: int64
        currentRequesterBookingId:
          type: string
          format: uuid
          nullable: true
        currentRequesterBookingStatus:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, REJECTED, CANCELLED]
          nullable: true
        upcomingBookings:
          type: array
          items:
            $ref: '#/components/schemas/CommunityResourceBooking'
    CommunityResourceBoard:
      type: object
      required: [communityId, communityName, resourceCount, pendingApprovals, resources, myBookings, approvalsQueue]
      properties:
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        resourceCount:
          type: integer
        pendingApprovals:
          type: integer
        resources:
          type: array
          items:
            $ref: '#/components/schemas/CommunityResource'
        myBookings:
          type: array
          items:
            $ref: '#/components/schemas/CommunityResourceBooking'
        approvalsQueue:
          type: array
          items:
            $ref: '#/components/schemas/CommunityResourceBooking'
    CreateCommunityIntegrationRequest:
      type: object
      required: [communityId, channel, name, targetUri, secret]
      properties:
        communityId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [WEBHOOK, EMAIL_DIGEST, CALENDAR_FEED, MAP_LINK]
        name:
          type: string
          minLength: 3
        targetUri:
          type: string
          pattern: '^https?://'
        secret:
          type: string
          minLength: 8
        autoRetry:
          type: boolean
          default: true
    PublishCommunityIntegrationEventRequest:
      type: object
      required: [communityId, eventType, title]
      properties:
        communityId:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [OFFICIAL_ANNOUNCEMENT, ACTIVITY_SCHEDULED, RESOURCE_BOOKED]
        referenceId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        locationLabel:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
    CommunityIntegration:
      type: object
      required: [id, communityId, channel, name, targetUri, enabled, autoRetry, dispatchable, createdBy, createdAt, consecutiveFailures, pendingDeliveries, failedDeliveries]
      properties:
        id:
          type: string
          format: uuid
        communityId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [WEBHOOK, EMAIL_DIGEST, CALENDAR_FEED, MAP_LINK]
        name:
          type: string
        targetUri:
          type: string
        enabled:
          type: boolean
        autoRetry:
          type: boolean
        dispatchable:
          type: boolean
          description: False when no connector is registered for the channel yet
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        consecutiveFailures:
          type: integer
        pendingDeliveries:
          type: integer
          format: int64
        failedDeliveries:
          type: integer
          format: int64
    CommunityIntegrationDelivery:
      type: object
      required: [id, integrationId, integrationName, channel, eventType, status, attempts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        integrationId:
          type: string
          format: uuid
        integrationName:
          type: string
        channel:
          type: string
        eventType:
          type: string
          enum: [OFFICIAL_ANNOUNCEMENT, ACTIVITY_SCHEDULED, RESOURCE_BOOKED]
        referenceId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [PENDING, DELIVERED, FAILED]
        attempts:
          type: integer
        lastError:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    CommunityIntegrationCenter:
      type: object
      required: [communityId, communityName, supportedChannels, integrationCount, pendingDeliveries, failedDeliveries, integrations, recentDeliveries]
      properties:
        communityId:
          type: string
          format: uuid
        communityName:
          type: string
        supportedChannels:
          type: array
          items:
            type: string
            enum: [WEBHOOK, EMAIL_DIGEST, CALENDAR_FEED, MAP_LINK]
        integrationCount:
          type: integer
        pendingDeliveries:
          type: integer
          format: int64
        failedDeliveries:
          type: integer
          format: int64
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/CommunityIntegration'
        recentDeliveries:
          type: array
          items:
            $ref: '#/components/schemas/CommunityIntegrationDelivery'
    CommunityIntegrationFanOut:
      type: object
      required: [communityId, eventType, targeted, delivered, failed, skippedNoConnector, deliveries]
      properties:
        communityId:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [OFFICIAL_ANNOUNCEMENT, ACTIVITY_SCHEDULED, RESOURCE_BOOKED]
        targeted:
          type: integer
        delivered:
          type: integer
        failed:
          type: integer
        skippedNoConnector:
          type: integer
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/CommunityIntegrationDelivery'

