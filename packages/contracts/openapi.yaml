  /api/community/exports/municipal-tickets/field-map:
    get:
      summary: Published column map for the municipal ticket export
      description: >-
        Every column in the municipal ticket shape with its type and meaning, readable before
        ingesting anything. Municipalities pin importers to this, so the order and names are a
        contract: adding a column is a breaking change and goes through an ADR.
      responses:
        '200':
          description: Ordered field map, matching the ticket column order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MunicipalTicketField'
  /api/community/exports/municipal-tickets:
    post:
      summary: Export signals as municipal tickets
      description: >-
        Translates community signals into the shape a city helpdesk ingests. Categories with no
        city service code are reported and excluded rather than defaulted, because a report filed
        against the wrong service code reaches the wrong department and then stops being chased.
        Personal contact details are redacted, since the destination is a system this platform
        does not control.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MunicipalTicketExportRequest'
      responses:
        '200':
          description: Tickets plus the field map and any categories left out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MunicipalTicketExport'
        '400':
          description: Request body is missing communityId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Community policy denied open-data export management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '404':
          description: Community not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/community/exports/anonymization-check:
    get:
      summary: Pre-publication anonymization checklist for public open data
      description: >-
        Scans the free text that a public export would carry and reports, per field, how many
        records contain an email address, phone number, national id, or payment card. Personal
        data is redacted on the way out, but redaction loses information a community may want
        to keep, so the step is made visible rather than silently applied.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Checklist with a blocking-findings list and a publishable verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDataAnonymizationChecklist'
        '403':
          description: Community policy denied open-data export management
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/community/exports/{exportType}:
    get:
      summary: Download one community-scoped export dataset as CSV or JSON
      parameters:
        - in: path
          name: exportType
          required: true
          schema:
            $ref: '#/components/schemas/CommunityOpenDataExportType'
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: format
          required: false
          schema:
            $ref: '#/components/schemas/CommunityOpenDataFormat'
      responses:
        '200':
          description: Open-data dataset download
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataSignalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataProposalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataVoteRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataDecisionRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataMetricRecordResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '403':
          description: Community policy denied open-data export download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
  /api/open-data/{communityId}/{exportType}:
    get:
      summary: Read one community open-data dataset through a scoped external API token
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: exportType
          required: true
          schema:
            $ref: '#/components/schemas/CommunityOpenDataExportType'
        - in: header
          name: X-Api-Token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scoped open-data dataset payload
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataSignalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataProposalRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataVoteRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataDecisionRecordResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenDataMetricRecordResponse'
        '401':
          description: Token missing, invalid, revoked, or missing the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Scoped token exceeded its rate limit window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsResponse'
  /api/community/transparency-report:
    get:
      summary: Monthly transparency report over a closed calendar month
      description: >-
        A report for a published month, with the previous month attached for comparison. Unlike
        the trust-metrics dashboard, which uses a rolling window so a live view reflects now,
        this is fixed to a closed month because published figures have to be reproducible. The
        same month returns the same numbers however long afterwards it is requested.
      parameters:
        - in: query
          name: communityId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: period
          required: false
          description: >-
            Calendar month as YYYY-MM, or a full ISO date. Defaults to the previous calendar
            month rather than the current one, because on the 3rd of April the current month is
            three days of data and calling that "this month's report" would mislead.
          schema:
            type: string
            example: 2026-03
      responses:
        '200':
          description: Report for the requested closed month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransparencyReport'
        '400':
          description: Period is not a recognisable calendar month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Caller is not a member of the community
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
