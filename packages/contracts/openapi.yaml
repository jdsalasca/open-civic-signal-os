  /api/ingest/validate:
    post:
      summary: Validate an exported report without persisting anything
      description: >-
        Dry run over a CSV export or a WhatsApp/Telegram chat export. Every row gets an
        outcome and every rejected row gets row-level errors, so a community data steward
        can fix the source file before anything is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Row-by-row validation report, nothing persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestReport'
        '400':
          description: Source is unknown, the file could not be parsed, or the payload is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Community policy denied signal import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '409':
          description: Export exceeds the row ceiling and was rejected before parsing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/ingest/commit:
    post:
      summary: Import the valid rows of an export and return the same report shape
      description: >-
        Persists only the rows that passed validation. Rejected rows are reported, never
        written, and every accepted signal keeps a sourceRef plus a transformationVersion
        so a later score change can be replayed against the original input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Import report with a signalId on every accepted row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestReport'
        '400':
          description: Source is unknown, the file could not be parsed, or the payload is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Community policy denied signal import
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPermissionDeniedError'
        '409':
          description: Export exceeds the row ceiling and was rejected before parsing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
