services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalos}
      POSTGRES_USER: ${POSTGRES_USER:-signalos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in infra/.env.prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Memory-lean Postgres for a ~2GB host. shared_buffers drops from the 128MB
    # default to 64MB; max_connections from 100 to 30 (matches the API HikariCP pool
    # of 5 plus the backup sidecar). Durability knobs (fsync, synchronous_commit)
    # are intentionally left at safe defaults.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - wal_buffers=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 320m
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  api:
    networks:
      default:
        aliases:
          - civic-api
    build:
      context: ../apps/api-java
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-signalos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-signalos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in infra/.env.prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in infra/.env.prod}
      INTEGRATION_CREDENTIAL_KEY: ${INTEGRATION_CREDENTIAL_KEY:?INTEGRATION_CREDENTIAL_KEY is required in infra/.env.prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in infra/.env.prod}
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:-support@open-comunity.eridu.top}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms32m -Xmx320m -XX:MaxMetaspaceSize=128m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss256k}
      APPLICATION_MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SMTP_HOST:-localhost}
      SPRING_MAIL_PORT: ${SMTP_PORT:-25}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    mem_limit: 512m
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: ../apps/web-react
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "127.0.0.1:5175:80"
    volumes:
      # Main nginx context with a deterministic single worker (see apps/web-react/nginx.main.conf).
      - ../apps/web-react/nginx.main.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  backup:
    image: postgres:15-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - chown postgres:postgres /backups && exec su-exec postgres /bin/sh /usr/local/bin/pg-backup-loop.sh
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalos}
      POSTGRES_USER: ${POSTGRES_USER:-signalos}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in infra/.env.prod}
      PGHOST: db
      PGPORT: "5432"
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - postgres-backups:/backups
      - ./scripts/pg-backup-loop.sh:/usr/local/bin/pg-backup-loop.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups -maxdepth 1 -type f -name 'open-community-*.dump' -mmin -1560 -print -quit)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    mem_limit: 64m
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
  postgres-backups:
