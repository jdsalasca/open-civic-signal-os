services:
  civic-mail-dev:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

  civic-db-dev:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: signalos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d signalos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - civic-db-dev-data:/var/lib/postgresql/data
    restart: unless-stopped

  civic-api-dev:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command:
      - bash
      - -lc
      - sed -i 's/\r$//' /workspace/infra/scripts/dev-api-entrypoint.sh && bash /workspace/infra/scripts/dev-api-entrypoint.sh
    volumes:
      - ../:/workspace
      - civic-m2-cache:/root/.m2
      - civic-api-target:/workspace/apps/api-java/target
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://civic-db-dev:5432/signalos
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_MAIL_HOST: civic-mail-dev
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: no-reply@open-civic.local
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      SUPPORT_CONTACT_EMAIL: support@open-civic.local
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3002"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
    ports:
      - "8081:8080"
    depends_on:
      civic-db-dev:
        condition: service_healthy
      civic-mail-dev:
        condition: service_started
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  civic-web-dev:
    image: node:20-alpine
    working_dir: /workspace
    command:
      - sh
      - -lc
      - sed -i 's/\r$//' /workspace/infra/scripts/dev-web-entrypoint.sh && sh /workspace/infra/scripts/dev-web-entrypoint.sh
    volumes:
      - ../:/workspace
      - civic-root-node-modules:/workspace/node_modules
      - civic-node-modules:/workspace/apps/web-react/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8081/api
      VITE_PROXY_TARGET: http://civic-api-dev:8080
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - civic-api-dev
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  civic-db-dev-data:
  civic-m2-cache:
  civic-api-target:
  civic-root-node-modules:
  civic-node-modules:
