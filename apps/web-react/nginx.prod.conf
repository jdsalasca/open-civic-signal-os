# Cache policy keyed on the request path. Vite emits content-hashed names under
# /assets/, so those files can never go stale and are cached for a year; the
# HTML shell points at those hashes and must always be revalidated, otherwise a
# deploy keeps serving links to the previous build. The map lives at http level
# (this file is included from nginx.conf), and because every declared value ends
# up in a single server-level add_header, the security headers below are
# inherited by every location instead of being dropped by a local add_header.
map $uri $civic_cache_control {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/fonts/ "public, max-age=31536000, immutable";
    ~^/index\.html$ "no-cache";
    ~^/(favicon\.svg|apple-touch-icon\.png|og-image\.png)$ "public, max-age=604800";
    ~^/(robots\.txt|sitemap\.xml|site\.webmanifest)$ "public, max-age=3600";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    keepalive_timeout 30s;
    keepalive_requests 200;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Baseline hardening, applied to static and proxied responses alike.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $civic_cache_control always;

    location = /api {
        return 308 /api/;
    }

    # ^~ so that API paths with a file extension (e.g. /api/export.txt) can
    # never be captured by the static-file regex below and answered with a 404.
    location ^~ /api/ {
        proxy_pass http://civic-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Hashed or versioned static files answer 404 when missing instead of
    # falling back to the SPA shell: an HTML body under a .js URL is served as
    # script and the browser reports a MIME mismatch instead of a missing chunk.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|webmanifest|xml|txt)$ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
