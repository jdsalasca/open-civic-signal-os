<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ca-title ca-desc">
  <title id="ca-title">A route that runs off the paper map</title>
  <desc id="ca-desc">A route that runs off the paper map. Animated SVG; respects reduced motion.</desc>
  <metadata>{"style":"papercraft","title":"A route that runs off the paper map","assets":[]}</metadata>
  <style>:root{--ca-duration:15s}
  .ca-anim{transform-box:fill-box;transform-origin:center}
  .ca-drift{animation:ca-drift calc(var(--ca-duration) / var(--ca-speed,1)) ease-in-out infinite alternate;animation-delay:var(--ca-delay,0s)}
  .ca-float{animation:ca-float calc(var(--ca-duration) / var(--ca-speed,1)) ease-in-out infinite alternate;animation-delay:var(--ca-delay,0s)}
  .ca-sway{animation:ca-sway calc(var(--ca-duration) / var(--ca-speed,1)) ease-in-out infinite alternate;animation-delay:var(--ca-delay,0s)}
  .ca-spin{animation:ca-spin calc(var(--ca-duration) * 3 / var(--ca-speed,1)) linear infinite;animation-delay:var(--ca-delay,0s)}
  .ca-breathe{animation:ca-breathe calc(var(--ca-duration) / var(--ca-speed,1)) ease-in-out infinite;animation-delay:var(--ca-delay,0s)}
  .ca-pulse{animation:ca-pulse calc(var(--ca-duration) / var(--ca-speed,1)) ease-in-out infinite;animation-delay:var(--ca-delay,0s)}
  .ca-reveal{animation:ca-reveal 1.4s ease both;animation-delay:var(--ca-delay,0s)}
  .ca-draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:ca-draw calc(var(--ca-duration) * .8 / var(--ca-speed,1)) ease forwards;animation-delay:var(--ca-delay,0s)}
  @keyframes ca-drift{to{transform:translateX(16px)}}
  @keyframes ca-float{to{transform:translateY(-14px)}}
  @keyframes ca-sway{to{transform:rotate(2deg)}}
  @keyframes ca-spin{to{transform:rotate(360deg)}}
  @keyframes ca-breathe{0%,100%{transform:scale(.97);opacity:.82}50%{transform:scale(1.03);opacity:1}}
  @keyframes ca-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes ca-reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes ca-draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.ca-anim,.ca-drift,.ca-float,.ca-sway,.ca-spin,.ca-breathe,.ca-pulse,.ca-reveal,.ca-draw{animation:none!important;transform:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style>
  <defs><filter id="ca-paper" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter><filter id="ca-grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter></defs>
  <rect width="1200" height="1200" fill="transparent"/>
  <g filter="url(#ca-paper)"><g class="ca-anim" style="--ca-delay:0s;--ca-speed:1" transform="translate(120 90) scale(0.9)"><g class="ca-anim ca-drift" style="--ca-delay:0s;--ca-speed:1"><path d="M0 60 C 0 18 56 4 94 22 C 126 -14 202 -4 216 46 C 264 44 282 96 246 116 H30 C -12 116 -24 80 0 60 Z" fill="#B8D4E0"/></g></g>
<g class="ca-anim" style="--ca-delay:0s;--ca-speed:1" transform="translate(880 130) scale(1.1)"><g class="ca-anim ca-drift" style="--ca-delay:1.2s;--ca-speed:1"><path d="M0 60 C 0 18 56 4 94 22 C 126 -14 202 -4 216 46 C 264 44 282 96 246 116 H30 C -12 116 -24 80 0 60 Z" fill="#B8D4E0"/></g></g>
