<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión · Open Civic Signal OS</title>
    <meta name="theme-color" content="#171614" />
    <style>
      :root {
        color-scheme: dark;
        --paper: #171614;
        --card: #221f1b;
        --ink: #f7f2e9;
        --ink-soft: #c9beb0;
        --brand: #f0a05a;
        --border: #3a342d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 30rem;
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(240, 160, 90, 0.14);
        color: var(--brand);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.65rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 0.75rem;
        color: var(--ink-soft);
        line-height: 1.6;
      }
      button {
        width: 100%;
        min-height: 2.75rem;
        margin-top: 0.75rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--brand);
        color: #23180d;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Sin conexión · Offline</span>
      <h1>No pudimos cargar la app</h1>
      <p>
        Revisa tu conexión y vuelve a intentar. El borrador de tu reporte sigue guardado en este
        dispositivo y aparecerá cuando la app cargue.
      </p>
      <p lang="en">Check your connection and try again. Your report draft stays on this device.</p>
      <button type="button" onclick="location.reload()">Reintentar · Try again</button>
    </main>
  </body>
</html>
