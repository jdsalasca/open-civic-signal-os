# Main nginx context for the production stack. The image's stock nginx.conf is
# replaced by this file (mounted read-only in infra/docker-compose.prod.yml) so
# the worker count is deterministic: on a ~2GB host shared with other sites, one
# worker is enough for static assets + API proxying and avoids one RSS per core.
worker_processes 1;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    access_log off;

    include /etc/nginx/conf.d/*.conf;
}
