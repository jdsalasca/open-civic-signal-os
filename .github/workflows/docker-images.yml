name: Docker Images

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    # The API image needs PostgreSQL to boot: Flyway runs on startup and ddl-auto is validate, so
    # without a database the container exits with "Connection refused" and the health endpoint never
    # answers. The smoke test was waiting for a server that could not exist, and had been failing on
    # every run since it was written.
    #
    # Giving it a database also makes the check stronger than "the container starts": the image now
    # proves it can migrate a fresh database and serve traffic.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: signalos
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d signalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-api
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (Web)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-web
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build API image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-java
          file: ./apps/api-java/Dockerfile
          load: true
          tags: local/${{ github.event.repository.name }}-api:smoke

      - name: Smoke test API container
        run: |
          # --add-host so the container can reach the runner's service container. GitHub runs service
          # containers on the VM's network, so localhost inside the job is the database, but a
          # `docker run` container needs the host gateway named explicitly.
          # JWT_SECRET has no default on purpose, so the container refuses to boot without one. Generated
          # here rather than hardcoded: this is a throwaway value whose only job is to prove the image
          # starts, and a literal secret in a workflow file is a literal secret that eventually ships.
          # Worth knowing why this was not caught locally: a developer's shell often already has one
          # exported, so the image boots on a laptop and fails in a clean runner.
          JWT_SECRET=$(head -c 48 /dev/urandom | base64)
          docker run -d --name api-smoke -p 18080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/signalos \
            -e SPRING_DATASOURCE_USERNAME=admin \
            -e SPRING_DATASOURCE_PASSWORD=password \
            -e JWT_SECRET="$JWT_SECRET" \
            local/${{ github.event.repository.name }}-api:smoke
          for i in {1..45}; do
            if curl -fsS http://localhost:18080/actuator/health > /dev/null; then
              echo "API smoke test passed"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api-smoke)" != "true" ]; then
              echo "The API container exited. Its logs:"
              docker logs api-smoke
              exit 1
            fi
            sleep 2
          done
          # Container logs on failure. The previous version failed with nothing but "Failed to connect",
          # which is not enough to tell a timeout apart from a crash apart from a wrong port - this is
          # why diagnosing it meant reproducing it locally instead of reading the CI output.
          curl -fsS http://localhost:18080/actuator/health || { docker logs api-smoke; exit 1; }
          docker rm -f api-smoke

      - name: Build Web image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-react
          file: ./apps/web-react/Dockerfile
          load: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: local/${{ github.event.repository.name }}-web:smoke

      - name: Smoke test Web container
        run: |
          docker run -d --name web-smoke -p 13000:80 local/${{ github.event.repository.name }}-web:smoke
          for i in {1..20}; do
            if curl -fsS http://localhost:13000/ > /dev/null; then
              echo "Web smoke test passed"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:13000/ > /dev/null
          docker rm -f web-smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-java
          file: ./apps/api-java/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Publish Web image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-react
          file: ./apps/web-react/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
