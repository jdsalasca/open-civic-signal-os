name: Docker Images

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    # The API image needs PostgreSQL to boot: Flyway runs on startup and ddl-auto is validate, so
    # without a database the container exits with "Connection refused" and the health endpoint never
    # answers. The smoke test was waiting for a server that could not exist, and had been failing on
    # every run since it was written.
    #
    # Giving it a database also makes the check stronger than "the container starts": the image now
    # proves it can migrate a fresh database and serve traffic.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: signalos
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d signalos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-api
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (Web)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-web
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build API image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-java
          file: ./apps/api-java/Dockerfile
          load: true
          tags: local/${{ github.event.repository.name }}-api:smoke
      - name: Build Web image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-react
          file: ./apps/web-react/Dockerfile
          load: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: local/${{ github.event.repository.name }}-web:smoke

      # nginx resolves proxy_pass upstreams at startup, not per request, so an unresolvable
      # "civic-api" does not degrade the proxy - it stops the container from booting at all:
      # [emerg] host not found in upstream "civic-api". Reproduced against nginx:1.27-alpine locally.
      # So both containers go on one network with that alias, which is also the deployment topology:
      # nginx in front, API behind.
      - name: Start both containers on a shared network
        run: |
          docker network create smoke-net
          JWT_SECRET=$(head -c 48 /dev/urandom | base64)
          echo "::add-mask::$JWT_SECRET"

          docker run -d --name api-smoke --network smoke-net --network-alias civic-api \
            -p 18080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/signalos \
            -e SPRING_DATASOURCE_USERNAME=admin \
            -e SPRING_DATASOURCE_PASSWORD=password \
            -e JWT_SECRET="$JWT_SECRET" \
            local/${{ github.event.repository.name }}-api:smoke

          docker run -d --name web-smoke --network smoke-net -p 13000:80 \
            local/${{ github.event.repository.name }}-web:smoke

      - name: Smoke test API container
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:18080/actuator/health > /dev/null; then
              echo "API container is up"
              exit 0
            fi
            sleep 2
          done
          echo "The API container never became healthy. Its logs:"
          docker logs api-smoke
          exit 1

      - name: Smoke test Web container
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:13000/ > /dev/null; then
              echo "Web container is serving"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' web-smoke)" != "true" ]; then
              echo "The web container exited. Its logs:"
              docker logs web-smoke
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:13000/ > /dev/null || { docker logs web-smoke; exit 1; }

          # The proxied API, through nginx, to the API, to the database. This is the path a resident
          # actually takes, and it is the one a check limited to "/" cannot see.
          curl -fsS http://localhost:13000/api/health | grep -q '"status":"UP"' \
            || { echo "The proxied API did not answer through nginx:"; docker logs web-smoke; exit 1; }
          echo "Web serves the app and proxies the API"

      - name: Remove smoke test containers
        if: always()
        run: |
          docker rm -f web-smoke api-smoke 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-java
          file: ./apps/api-java/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Publish Web image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web-react
          file: ./apps/web-react/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
