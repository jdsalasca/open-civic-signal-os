services:
  civic-db:
    image: postgres:15-alpine
    container_name: civic-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signalos}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy infra/.env.example to infra/.env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-signalos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - civic-db-data:/var/lib/postgresql/data

  civic-api:
    image: infra-api
    container_name: civic-api
    build:
      context: ./apps/api-java
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://civic-db:5432/${POSTGRES_DB:-signalos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      SPRING_PROFILES_ACTIVE: dev
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/google-credentials.json
    volumes:
      - "${LOCAL_GOOGLE_CREDENTIALS_PATH:-./infra/secrets/google-credentials.json}:/app/secrets/google-credentials.json:ro"
    depends_on:
      civic-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  civic-web:
    image: infra-web
    container_name: civic-web
    build:
      context: ./apps/web-react
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    depends_on:
      civic-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  civic-db-data: